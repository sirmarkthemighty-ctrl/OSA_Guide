<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OSA Guide</title>
<script>try{if(localStorage.getItem('osa-theme')==='dark')document.documentElement.classList.add('dark')}catch(e){}</script>
<style>
/* Bedside UI tokens (see bronchodilator-src/BEDSIDE-UI.md): slate neutrals, indigo = the one "on" state, soft tints per meaning */
:root{--bg:#f1f5f9;--card:#fff;--inset:#f8fafc;--bd:#e2e8f0;--tx:#1e293b;--mu:#64748b;--ac:#4f46e5;--acx:#6366f1;--cr:#fff}
html.dark{--bg:#0b1220;--card:#151f32;--inset:#101a2b;--bd:#263449;--tx:#e2e8f0;--mu:#94a3b8;--ac:#4f46e5;--acx:#818cf8}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
html.dark{color-scheme:dark}
body{color:var(--tx);font:14px/1.45 'IBM Plex Sans','IBM Plex Sans Thai',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.wrap{max-width:1024px;margin:0 auto;padding:12px 16px 40px}
/* tints: --c text, --cb tint background, --cd tint border, --cs solid (on state) */
.indigo{--c:#4338ca;--cb:#eef2ff;--cd:#c7d2fe}.amber{--c:#b45309;--cb:#fffbeb;--cd:#fde68a}.emerald{--c:#047857;--cb:#ecfdf5;--cd:#a7f3d0}.rose{--c:#be123c;--cb:#fff1f2;--cd:#fecdd3}.orange{--c:#c2410c;--cb:#fff7ed;--cd:#fed7aa}.sky{--c:#0369a1;--cb:#f0f9ff;--cd:#bae6fd}.violet{--c:#6d28d9;--cb:#f5f3ff;--cd:#ddd6fe}.teal{--c:#0f766e;--cb:#f0fdfa;--cd:#99f6e4}.slate{--c:#334155;--cb:#f8fafc;--cd:#e2e8f0}
html.dark .indigo{--c:#a5b4fc;--cb:rgba(99,102,241,.12);--cd:rgba(99,102,241,.35)}html.dark .amber{--c:#fcd34d;--cb:rgba(245,158,11,.12);--cd:rgba(245,158,11,.35)}html.dark .emerald{--c:#6ee7b7;--cb:rgba(16,185,129,.12);--cd:rgba(16,185,129,.35)}html.dark .rose{--c:#fda4af;--cb:rgba(244,63,94,.12);--cd:rgba(244,63,94,.35)}html.dark .orange{--c:#fdba74;--cb:rgba(249,115,22,.12);--cd:rgba(249,115,22,.35)}html.dark .sky{--c:#7dd3fc;--cb:rgba(14,165,233,.12);--cd:rgba(14,165,233,.35)}html.dark .violet{--c:#c4b5fd;--cb:rgba(139,92,246,.12);--cd:rgba(139,92,246,.35)}html.dark .teal{--c:#5eead4;--cb:rgba(20,184,166,.12);--cd:rgba(20,184,166,.35)}html.dark .slate{--c:#cbd5e1;--cb:rgba(100,116,139,.12);--cd:rgba(100,116,139,.35)}
header{padding:4px 0 10px;position:relative}
.top{display:flex;gap:6px;align-items:center;justify-content:flex-end;margin-bottom:6px}
h1{margin:0 0 4px;font-size:22px;font-weight:800;line-height:1.2;color:var(--tx)}
@media(min-width:640px){h1{font-size:26px}}
.sub{font-size:12px;color:var(--mu)}
.by{font-size:11px;font-weight:600;color:#6366f1;margin-top:2px}
.disc{font-size:11px;font-weight:600;color:#b45309}
html.dark .disc{color:#fcd34d}
.pill{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;padding:6px 10px;font:700 10px/1 inherit;font-family:inherit;cursor:pointer;box-shadow:0 1px 2px #0001;display:inline-flex;align-items:center;gap:6px;transition:.15s}
.pill:hover{background:var(--inset)}
.pill.round{width:28px;height:28px;padding:0;justify-content:center;color:var(--mu)}
.pill svg,.tile svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
nav{position:sticky;top:0;z-index:30;margin:0 -16px;padding:8px 16px;background:color-mix(in srgb,var(--bg) 95%,transparent);backdrop-filter:blur(8px);display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
@media(min-width:640px){nav{display:flex;flex-wrap:wrap;gap:8px}}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:0;padding:6px 2px;border-radius:8px;border:1px solid var(--cd);background:var(--cb);color:var(--c);font:700 10px/1.15 inherit;font-family:inherit;cursor:pointer;box-shadow:0 1px 2px #0001;text-align:center;transition:.15s}
.tile svg{width:16px;height:16px}
.tile span{min-width:0;max-width:100%;overflow-wrap:anywhere}
.tile:hover{filter:brightness(.97)}
.tile:active{transform:scale(.95)}
.tile.on{background:var(--ac);border-color:var(--ac);color:#fff}
@media(min-width:640px){.tile{flex-direction:row;gap:8px;padding:8px 16px;font-size:13px;white-space:nowrap}.tile svg{width:16px;height:16px}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:10px 0;box-shadow:0 1px 2px #0001}
details.b{border:1px solid var(--cd);border-radius:12px;background:var(--cb);margin:10px 0;overflow:hidden;box-shadow:0 1px 2px #0001}
details.b>summary{cursor:pointer;list-style:none;padding:10px 12px;font-weight:800;font-size:14px;display:flex;gap:8px;align-items:center;color:var(--c)}
details.b>summary::-webkit-details-marker{display:none}
details.b>summary::after{content:'';width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg) translateY(-2px);transition:transform .15s;flex:0 0 auto}
details.b[open]>summary::after{transform:rotate(-135deg)}
details.b>.in{padding:2px 12px 12px;background:var(--card);border-top:1px solid var(--cd)}
.cnt{font-size:10px;font-weight:800;color:var(--c);border:1px solid var(--cd);background:var(--card);border-radius:4px;padding:0 5px;margin-left:auto}
label.ck{display:flex;gap:9px;align-items:flex-start;padding:8px 2px;border-top:1px solid var(--bd);cursor:pointer}
label.ck:first-child{border-top:0}
label.ck input{width:18px;height:18px;margin-top:1px;flex:0 0 auto;accent-color:#4f46e5}
label.ck span small{display:block;color:var(--mu);font-size:11px}
.res{border-radius:10px;padding:10px 12px;margin-top:10px;border:1px solid var(--cd);background:var(--cb);color:var(--c);font-weight:700}
.res b{font-size:20px}
.res small{display:block;font-weight:500;color:var(--tx);margin-top:4px;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.grid label{font-size:11px;font-weight:700;color:var(--mu);display:block}
input[type=number],select{width:100%;margin-top:2px;padding:7px 8px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font:inherit;box-shadow:0 1px 2px #0001}
input:focus,select:focus,button:focus-visible,summary:focus-visible{outline:2px solid #6366f1;outline-offset:1px}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{border:1px solid var(--bd);padding:5px 7px;text-align:left;vertical-align:top}
th{background:var(--inset)}
.tw{overflow-x:auto}
ul{margin:4px 0;padding-left:18px}li{margin:2px 0}
.note{font-size:11px;color:var(--mu)}
.chip{display:inline-block;font-size:10px;font-weight:700;border:1px solid var(--cd);background:var(--cb);color:var(--c);border-radius:4px;padding:1px 4px;margin-right:4px}
.btn{border:1px solid var(--bd);background:var(--card);color:var(--mu);border-radius:8px;padding:6px 12px;font:700 11px inherit;font-family:inherit;cursor:pointer;box-shadow:0 1px 2px #0001}
.btn:hover{background:var(--inset);color:var(--tx)}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.7);backdrop-filter:blur(4px);z-index:50;display:grid;place-items:center;padding:12px;animation:fi .15s}
.modal>div{background:var(--card);border:1px solid var(--bd);border-radius:16px;max-width:520px;width:100%;max-height:85vh;overflow:auto;padding:16px;animation:zi .15s}
@keyframes fi{from{opacity:0}}@keyframes zi{from{transform:scale(.95)}}
@media(min-width:640px){.grid{grid-template-columns:repeat(4,1fr)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<script>
const VERSION='1.0.0', DATE='2026-11-16';
const a=(en,th)=>({en,th});
let sbMod=false,lang='en',tab='check',stop={},ess=Array(8).fill(null),checks={},psg={},openSet=new Set(['sx','stop','psgin']),modal=null;
try{lang=localStorage.getItem('osa-lang')||'en';checks=JSON.parse(localStorage.getItem('osa-checks')||'{}')}catch(e){}
const t=o=>o[lang]||o.en;
const save=()=>{try{localStorage.setItem('osa-checks',JSON.stringify(checks));localStorage.setItem('osa-lang',lang)}catch(e){}};

const UI={
title:a('OSA Guide','คู่มือโรคหยุดหายใจขณะหลับ (OSA)'),
sub:a('Obstructive sleep apnoea — checklist, screening, polysomnogram, treatment','Obstructive sleep apnoea — เช็กลิสต์ การคัดกรอง ผลตรวจการนอนหลับ การรักษา'),
disc:a('Decision support only, not a substitute for clinical judgement','เป็นเครื่องมือช่วยตัดสินใจเท่านั้น ไม่ทดแทนดุลยพินิจทางคลินิก'),
tabs:[['check',a('Checklist','เช็กลิสต์'),'emerald','<path d="m9 11 3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',a('Check','เช็ก')],['score',a('Screening scores','คะแนนคัดกรอง'),'violet','<path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/>',a('Scores','คะแนน')],['psg',a('Polysomnogram','ผลตรวจการนอนหลับ'),'sky','<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',a('PSG','PSG')],['tx',a('Treatment','การรักษา'),'teal','<path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"/><path d="m8.5 8.5 7 7"/>',a('Treat','รักษา')],['thai',a('Thai guideline 2025','แนวทางไทย 2568'),'amber','<path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><path d="M4 22v-7"/>',a('Thai','ไทย')],['src',a('Sources','แหล่งอ้างอิง'),'slate','<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>',a('Sources','อ้างอิง')]],
reset:a('Clear all','ล้างทั้งหมด'),
};

/* ---------- checklist data ---------- */
const GROUPS=[
['sx','indigo',a('Night-time symptoms','อาการตอนกลางคืน'),[
 [a('Loud, habitual snoring','กรนดังเป็นประจำ')],
 [a('Witnessed apnoeas (partner sees pauses in breathing)','มีคนเห็นหยุดหายใจขณะหลับ')],
 [a('Gasping / choking arousals','สะดุ้งตื่น หายใจเฮือก สำลัก')],
 [a('Nocturia ≥ 2 per night','ปัสสาวะกลางคืน ≥ 2 ครั้ง')],
 [a('Restless, fragmented sleep; night sweats','นอนไม่สนิท ตื่นบ่อย เหงื่อออกกลางคืน')],
 [a('Dry mouth / sore throat on waking','ปากคอแห้งตอนตื่น')],
 [a('Night-time reflux','กรดไหลย้อนตอนกลางคืน')]]],
['dx','amber',a('Daytime symptoms','อาการตอนกลางวัน'),[
 [a('Excessive daytime sleepiness','ง่วงนอนมากตอนกลางวัน')],
 [a('Unrefreshing sleep','นอนแล้วไม่สดชื่น')],
 [a('Morning headache','ปวดศีรษะตอนเช้า')],
 [a('Fatigue','อ่อนเพลีย')],
 [a('Poor concentration / memory','สมาธิ/ความจำลดลง')],
 [a('Irritability, low mood','หงุดหงิด ซึมเศร้า')],
 [a('Drowsy driving or near-miss','ง่วงขณะขับรถ หรือเกือบเกิดอุบัติเหตุ')],
 [a('Reduced libido / erectile dysfunction','ความต้องการทางเพศลดลง / หย่อนสมรรถภาพ')]]],
['sg','emerald',a('Signs on examination','อาการแสดงจากการตรวจ'),[
 [a('Obesity (BMI ≥ 25 Asian cut-off; ≥ 30 general)','อ้วน (BMI ≥ 25 เกณฑ์เอเชีย; ≥ 30 ทั่วไป)')],
 [a('Neck circumference > 40 cm','รอบคอ > 40 ซม.')],
 [a('Crowded oropharynx (Mallampati III–IV)','ช่องคอแคบ (Mallampati III–IV)')],
 [a('Enlarged tonsils (grade 3–4)','ต่อมทอนซิลโต (เกรด 3–4)')],
 [a('Retrognathia / micrognathia / overjet','คางร่น/เล็ก ฟันบนยื่น')],
 [a('Macroglossia / scalloped tongue','ลิ้นโต ขอบลิ้นเป็นรอยฟัน')],
 [a('Narrow / high-arched palate','เพดานปากแคบ/สูง')],
 [a('Nasal obstruction (septal deviation, turbinate hypertrophy)','จมูกอุดตัน (ผนังกั้นจมูกคด, เยื่อจมูกบวมโต)')]]],
['cm','rose',a('Risk factors & comorbidities','ปัจจัยเสี่ยงและโรคร่วม'),[
 [a('Hypertension (especially resistant / non-dipping)','ความดันสูง (โดยเฉพาะคุมยาก/ไม่ลดลงกลางคืน)')],
 [a('Atrial fibrillation / arrhythmia','AF / หัวใจเต้นผิดจังหวะ')],
 [a('Heart failure / coronary disease','หัวใจล้มเหลว / โรคหลอดเลือดหัวใจ')],
 [a('Stroke / TIA','โรคหลอดเลือดสมอง / TIA')],
 [a('Type 2 diabetes / metabolic syndrome','เบาหวานชนิดที่ 2 / metabolic syndrome')],
 [a('Pulmonary hypertension','ความดันปอดสูง')],
 [a('Fatty liver (MASLD)','ไขมันพอกตับ (MASLD)')],
 [a('Male, age > 50, post-menopause','เพศชาย อายุ > 50 วัยหมดประจำเดือน')],
 [a('Alcohol / sedatives / opioids','แอลกอฮอล์ / ยานอนหลับ / opioid')],
 [a('Hypothyroidism, acromegaly, PCOS','ไทรอยด์ต่ำ, acromegaly, PCOS')]]],
['rf','orange',a('Red flags — act sooner / choose in-lab PSG','สัญญาณเตือน — รีบดำเนินการ / เลือก PSG ในห้องปฏิบัติการ'),[
 [a('Drowsy driving, or safety-critical job (driver, pilot, machinery)','ง่วงขณะขับรถ หรืออาชีพเสี่ยง (คนขับ นักบิน เครื่องจักร)')],
 [a('Awake SpO₂ < 94 % or serum HCO₃ ≥ 27 (think obesity hypoventilation)','SpO₂ ขณะตื่น < 94 % หรือ HCO₃ ≥ 27 (นึกถึง obesity hypoventilation)')],
 [a('Significant cardiopulmonary or neuromuscular disease','โรคหัวใจ-ปอด หรือโรคกล้ามเนื้อ/ประสาทที่รุนแรง')],
 [a('Opioid use or suspected central apnoea (HF, stroke)','ใช้ opioid หรือสงสัย central apnoea (HF, stroke)')],
 [a('Pregnancy','ตั้งครรภ์')],
 [a('Surgery under GA / sedation planned','มีแผนผ่าตัดดมยา/ให้ยาระงับประสาท')],
 [a('Polycythaemia, cor pulmonale','เลือดข้น, cor pulmonale')]]],
];

/* ---------- STOP-Bang / ESS ---------- */
const STOPQ=[
 [a('Snoring — loud (heard through a closed door)?','กรนเสียงดัง (ได้ยินผ่านประตูปิด)?')],
 [a('Tired — often tired, fatigued or sleepy in the daytime?','เหนื่อย/ง่วงตอนกลางวันบ่อย?')],
 [a('Observed — anyone seen you stop breathing in sleep?','มีคนเห็นหยุดหายใจขณะหลับ?')],
 [a('Pressure — treated or diagnosed hypertension?','ความดันโลหิตสูง (ได้รับการรักษาหรือวินิจฉัย)?')],
 [a('BMI > 35 kg/m²?','BMI > 35 กก./ม.²?')],
 [a('Age > 50 years?','อายุ > 50 ปี?')],
 [a('Neck circumference > 40 cm?','รอบคอ > 40 ซม.?')],
 [a('Gender — male?','เพศชาย?')]];
const ESSQ=[a('Sitting and reading','นั่งอ่านหนังสือ'),a('Watching TV','ดูโทรทัศน์'),a('Sitting inactive in a public place (theatre, meeting)','นั่งเฉยๆ ในที่สาธารณะ (โรงหนัง ประชุม)'),a('Passenger in a car for 1 hour without a break','นั่งรถเป็นผู้โดยสารต่อเนื่อง 1 ชม.'),a('Lying down to rest in the afternoon','เอนตัวพักตอนบ่าย'),a('Sitting and talking to someone','นั่งคุยกับผู้อื่น'),a('Sitting quietly after lunch (no alcohol)','นั่งเงียบๆ หลังอาหารกลางวัน (ไม่ดื่มแอลกอฮอล์)'),a('In a car, stopped a few minutes in traffic','อยู่ในรถ หยุดติดไฟแดง/การจราจรไม่กี่นาที')];
const ESSOPT=[a('0 — would never doze','0 — ไม่เคยเผลอหลับ'),a('1 — slight chance','1 — มีโอกาสเล็กน้อย'),a('2 — moderate chance','2 — มีโอกาสปานกลาง'),a('3 — high chance','3 — มีโอกาสสูง')];

/* Berlin Questionnaire (Netzer 1999); item 1 "Do you snore?" is not scored, so omitted */
const FREQ=[a('Nearly every day','เกือบทุกวัน'),a('3–4 times a week','3–4 ครั้ง/สัปดาห์'),a('1–2 times a week','1–2 ครั้ง/สัปดาห์'),a('1–2 times a month','1–2 ครั้ง/เดือน'),a('Never or almost never','ไม่เคยหรือแทบไม่เคย')];
const YN=[a('Yes','ใช่'),a('No','ไม่ใช่')];
const LOUD=[a('Slightly louder than breathing','ดังกว่าการหายใจเล็กน้อย'),a('As loud as talking','ดังเท่าเสียงพูด'),a('Louder than talking','ดังกว่าเสียงพูด'),a('Very loud (heard in adjacent rooms)','ดังมาก (ได้ยินถึงห้องข้างๆ)')];
const BERQ=[
 [1,a('How loud is your snoring?','เสียงกรนดังแค่ไหน?'),LOUD,[1,2,3]],
 [1,a('How often do you snore?','กรนบ่อยแค่ไหน?'),FREQ,[0,1]],
 [1,a('Has your snoring bothered other people?','เสียงกรนรบกวนคนอื่นหรือไม่?'),YN,[0]],
 [1,a('Has anyone noticed that you stop breathing during sleep?','มีคนสังเกตว่าคุณหยุดหายใจขณะหลับหรือไม่?'),FREQ,[0,1]],
 [2,a('How often do you feel tired or fatigued after sleeping?','รู้สึกเหนื่อย/เพลียหลังตื่นนอนบ่อยแค่ไหน?'),FREQ,[0,1]],
 [2,a('When awake, how often do you feel tired, fatigued or not up to par?','ตอนตื่น รู้สึกเหนื่อย เพลีย หรือไม่สดชื่นบ่อยแค่ไหน?'),FREQ,[0,1]],
 [2,a('Have you ever nodded off or fallen asleep while driving?','เคยเผลอหลับขณะขับรถหรือไม่?'),YN,[0]],
 [3,a('Do you have high blood pressure?','เป็นความดันโลหิตสูงหรือไม่?'),YN,[0]],
 [3,a('Is your BMI > 30 kg/m²?','BMI > 30 กก./ม.² หรือไม่?'),YN,[0]]];
let ber=Array(9).fill(null);
function berRes(){
 const pts=[0,0,0,0];
 BERQ.forEach(([c,,,pos],i)=>{if(ber[i]!==null&&pos.includes(ber[i]))pts[c]++});
 const cat=[null,pts[1]>=2,pts[2]>=2,pts[3]>=1];
 const done=ber.every(v=>v!==null);
 return{pts,cat,done,n:cat.slice(1).filter(Boolean).length};
}
function stopRisk(){
 const n=STOPQ.reduce((s,_,i)=>s+(stop[i]?1:0),0);
 const s4=[0,1,2,3].filter(i=>stop[i]).length;
 const mod=stop[7]||stop[4]||stop[6];
 let k,c;
 if(sbMod){if(n>=3){k='high';c='rose'}else{k='low';c='emerald'}}
 else if(n>=5||(n>=3&&s4>=2&&mod)){k='high';c='rose'}else if(n>=3){k='int';c='amber'}else{k='low';c='emerald'}
 return{n,k,c};
}

  const cen=ca/(oa+ca+hy||1)*100;
  let ex=`${t(a('Events','เหตุการณ์'))}: ${oa+ca+hy} / ${tst} h`;

 }

 PF.forEach(([k,l])=>{if(g(k)===null)na.push(t(l))});
 const miss=na.length?`<div class="note" style="margin-top:8px">N/A: ${na.join(', ')}</div>`:'';
 return head+(lines.length?`<ul style="margin-top:8px">${lines.map(l=>`<li>${l}</li>`).join('')}</ul>`:'')+miss;
}

 return `<p class="note" style="margin:10px 0 0">${t(a('Summary of the 2025 Thai adult guideline (Thai Snoring and Sleep Apnea Society, RCOT). Page numbers are journal pages.','สรุปแนวทางไทยสำหรับผู้ใหญ่ พ.ศ. 2568 (สมาคมโรคนอนกรนและหยุดหายใจขณะหลับ ราชวิทยาลัย โสต ศอ นาสิกแพทย์ฯ) เลขหน้าคือหน้าของวารสาร'))}</p>`
 +THAI.map(([c,ti,items,src],i)=>det('th'+i,c,t(ti),'<ul>'+items.map(x=>`<li>${t(x)}</li>`).join('')+'</ul>'+(src?`<p class="note">${t(a('Source: Thai guideline 2025','ที่มา: แนวทางไทย 2568'))}, ${src}</p>`:''),'')).join('');
}

const CHANGELOG=[[ '1.0.0',DATE,[a('First release: symptom/sign checklist, STOP-Bang and Epworth scores, polysomnogram interpreter, treatment ladder.','เปิดตัวครั้งแรก: เช็กลิสต์อาการ/อาการแสดง คะแนน STOP-Bang และ Epworth ตัวช่วยอ่านผล PSG ลำดับการรักษา'),a('Modified STOP-Bang toggle (Thai: BMI > 30, high risk ≥ 3).','เพิ่มสวิตช์ STOP-Bang แบบปรับปรุง (ไทย: BMI > 30, ความเสี่ยงสูง ≥ 3)'),a('Berlin Questionnaire (3 categories, 9 scored items).','เพิ่มแบบสอบถาม Berlin (3 หมวด 9 ข้อที่นับคะแนน)'),a('Thai guideline tab: Thai Snoring and Sleep Apnea Society 2025 adult guideline summarised (screening, sleep tests, severity, PAP, oral appliance, drugs, follow-up).','เพิ่มแท็บแนวทางไทย: สรุปแนวทางผู้ใหญ่ พ.ศ. 2568 ของสมาคมโรคนอนกรนและหยุดหายใจขณะหลับ (คัดกรอง การตรวจการนอน ความรุนแรง PAP อุปกรณ์ในช่องปาก ยา การติดตาม)'),a('Look matched to the Bronchodilator Guide (Bedside UI): slate and indigo palette, tinted guide tiles, round theme button.','ปรับหน้าตาให้ตรงกับ Bronchodilator Guide (Bedside UI): โทนสี slate และ indigo ปุ่มนำทางสีอ่อน ปุ่มธีมกลม')]]];

/* ---------- render ---------- */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const det=(k,c,title,body,cnt)=>`<details class="b ${c}" data-k="${k}"${openSet.has(k)?' open':''}><summary><span>${title}</span>${cnt?`<span class="cnt">${cnt}</span>`:''}</summary><div class="in">${body}</div></details>`;

function vCheck(){
 let tot=0,all=0;
 const bl=GROUPS.map(([k,c,ti,items])=>{
  const n=items.filter((_,i)=>checks[k+i]).length;tot+=n;all+=items.length;
  return det(k,c,t(ti),items.map(([l],i)=>`<label class="ck"><input type="checkbox" data-ck="${k+i}"${checks[k+i]?' checked':''}><span>${t(l)}</span></label>`).join(''),`${n}/${items.length}`);
 }).join('');
 const cnt=g=>GROUPS.find(x=>x[0]===g)[3].filter((_,i)=>checks[g+i]).length;
 const night=cnt('sx'),day=cnt('dx'),sg=cnt('sg'),cm=cnt('cm'),rf=cnt('rf');
 let msg=t(a('Tick what you find. This is a prompt for testing, not a diagnosis.','ติ๊กสิ่งที่พบ นี่เป็นตัวช่วยตัดสินใจส่งตรวจ ไม่ใช่การวินิจฉัย'));
 let c='slate';
 if(tot){
  if(rf){c='orange';msg=t(a('Red flag present: arrange a sleep study promptly; in-lab PSG is preferred.','มีสัญญาณเตือน: ส่งตรวจการนอนหลับโดยเร็ว แนะนำ PSG ในห้องปฏิบัติการ'))}
  else if((night>=2)&&(day>=1||sg>=2||cm>=1)){c='rose';msg=t(a('Typical symptoms with supporting features: high pre-test probability — complete STOP-Bang and arrange a sleep study.','อาการเข้าได้ร่วมกับปัจจัยสนับสนุน: โอกาสก่อนตรวจสูง — ทำ STOP-Bang และส่งตรวจการนอนหลับ'))}
  else if(night+day+sg+cm>=3){c='amber';msg=t(a('Some features: complete STOP-Bang and Epworth to decide on testing.','มีบางข้อ: ทำ STOP-Bang และ Epworth เพื่อตัดสินใจส่งตรวจ'))}
  else{c='emerald';msg=t(a('Few features: low suspicion unless symptoms evolve.','พบน้อยข้อ: ความสงสัยต่ำ ยกเว้นอาการเปลี่ยนแปลง'))}
 }
 return `<div class="res ${c}" style="display:flex;gap:10px;align-items:flex-start;justify-content:space-between"><div><b>${tot}/${all}</b> ${t(a('items ticked','ข้อที่ติ๊ก'))}<small>${msg}</small></div><button class="btn" data-act="clear">${t(UI.reset)}</button></div>`+bl;
}
function berBlock(){
 const r=berRes();
 const cn=[null,a('Category 1 — snoring and apnoeas (positive ≥ 2 points)','หมวด 1 — การกรนและหยุดหายใจ (บวกเมื่อ ≥ 2 คะแนน)'),a('Category 2 — daytime tiredness (positive ≥ 2 points)','หมวด 2 — ความเหนื่อยตอนกลางวัน (บวกเมื่อ ≥ 2 คะแนน)'),a('Category 3 — hypertension or BMI > 30 (positive if either)','หมวด 3 — ความดันสูงหรือ BMI > 30 (บวกถ้ามีอย่างใดอย่างหนึ่ง)')];
 let body='';
 [1,2,3].forEach(c=>{
  body+=`<p style="margin:10px 0 0;font-weight:800">${t(cn[c])} <span class="chip ${r.cat[c]?'rose':'emerald'}">${r.pts[c]} ${r.cat[c]?'+':'−'}</span></p>`;
  BERQ.forEach(([cc,q,opts],i)=>{if(cc===c)body+=`<label style="display:block;margin:6px 0;font-weight:600">${t(q)}<select data-ber="${i}"><option value="">—</option>${opts.map((o,v)=>`<option value="${v}"${ber[i]===v?' selected':''}>${t(o)}</option>`).join('')}</select></label>`});
 });
 const res=r.done?`<div class="res ${r.n>=2?'rose':'emerald'}"><b>${r.n}/3 ${t(a('categories positive','หมวดที่เป็นบวก'))}</b> — ${r.n>=2?t(a('High risk of sleep apnoea','ความเสี่ยงสูงต่อ sleep apnoea')):t(a('Low risk','ความเสี่ยงต่ำ'))}<small>${t(a('High risk = 2 or more positive categories.','ความเสี่ยงสูง = เป็นบวก 2 หมวดขึ้นไป'))}</small></div>`:`<div class="res slate">N/A <small>${t(a('Answer all 9 items.','ตอบให้ครบ 9 ข้อ'))}</small></div>`;
 return det('ber','sky',t(a('Berlin Questionnaire','แบบสอบถาม Berlin')),body+res+`<p class="note">${t(a('Item 1 of the original ("Do you snore?") is not scored and is left out here. Netzer NC et al., Ann Intern Med 1999.','ข้อ 1 ของต้นฉบับ ("คุณกรนหรือไม่?") ไม่นับคะแนน จึงไม่ได้ใส่ไว้ Netzer NC et al., Ann Intern Med 1999'))}</p>`,r.done?r.n+'/3':'N/A');
}
function vScore(){
 const r=stopRisk();
 const BMI30=a('BMI > 30 kg/m² (modified)?','BMI > 30 กก./ม.² (แบบปรับปรุง)?');
 const tog=`<label class="ck"><input type="checkbox" data-sbmod="1"${sbMod?' checked':''}><span><b>${t(a('Modified STOP-Bang (Thai)','STOP-Bang แบบปรับปรุง (ไทย)'))}</b><small>${t(a('BMI cut-off > 30 instead of > 35; high risk = score ≥ 3. Ramathibodi study, 400 elective surgical patients, BMC Anesthesiol 2021.','BMI > 30 แทน > 35; ความเสี่ยงสูง = คะแนน ≥ 3 การศึกษารามาธิบดี ผู้ป่วยผ่าตัดตามแผน 400 ราย BMC Anesthesiol 2021'))}</small></span></label>`;
 const sb=tog+STOPQ.map(([q],i)=>`<label class="ck"><input type="checkbox" data-st="${i}"${stop[i]?' checked':''}><span>${t(sbMod&&i===4?BMI30:q)}</span></label>`).join('');
 const e=essRes();
 const eb=ESSQ.map((q,i)=>`<label style="display:block;margin:8px 0;font-weight:600">${i+1}. ${t(q)}<select data-ess="${i}"><option value="">—</option>${ESSOPT.map((o,v)=>`<option value="${v}"${ess[i]===v?' selected':''}>${t(o)}</option>`).join('')}</select></label>`).join('');
 return det('stop','indigo','STOP-Bang',sb+`<div class="res ${r.c}"><b>${r.n}/8</b> — ${t(RISKTXT[r.k])}<small>${t(RISKACT[r.k])}</small></div><p class="note">${sbMod?t(a('Modified: 0–2 low · ≥ 3 high. In that study a score ≥ 3 did not significantly predict overall perioperative adverse events, but it did flag difficult ventilation, laryngoscopic view ≥ 3, oxygen need after surgery and ICU admission.','แบบปรับปรุง: 0–2 ต่ำ · ≥ 3 สูง ในการศึกษานี้ คะแนน ≥ 3 ไม่สัมพันธ์กับภาวะแทรกซ้อนรวมอย่างมีนัยสำคัญ แต่บ่งชี้ภาวะใส่ท่อ/ช่วยหายใจยาก laryngoscopic view ≥ 3 ต้องการออกซิเจนหลังผ่าตัด และการเข้า ICU')):t(a('0–2 low · 3–4 intermediate · 5–8 high. Also high risk if ≥ 2 of the first four items plus male, BMI > 35 or neck > 40 cm.','0–2 ต่ำ · 3–4 ปานกลาง · 5–8 สูง และถือว่าสูงถ้า ≥ 2 ใน 4 ข้อแรก ร่วมกับเพศชาย BMI > 35 หรือรอบคอ > 40 ซม.'))}</p>`)
 +det('ess','amber','Epworth Sleepiness Scale',`<p class="note">${t(a('How likely are you to doze off (not just feel tired) in these situations, recently?','ในช่วงนี้ มีโอกาสเผลอหลับ (ไม่ใช่แค่รู้สึกเหนื่อย) ในสถานการณ์ต่อไปนี้มากเพียงใด'))}</p>${eb}`+(e?`<div class="res ${e.c}"><b>${e.s}/24</b> — ${t(ESSTXT[e.k])}<small>${t(a('Above 10 suggests excessive daytime sleepiness; sleepiness may be absent in many OSA patients, so a low score does not exclude OSA.','เกิน 10 บ่งชี้ง่วงกลางวันผิดปกติ ผู้ป่วย OSA จำนวนมากไม่ง่วง คะแนนต่ำจึงไม่ตัด OSA'))}</small></div>`:`<div class="res slate">N/A <small>${t(a('Answer all 8 items.','ตอบให้ครบ 8 ข้อ'))}</small></div>`),e?e.s+'/24':'N/A')
 +berBlock()
 +`<p class="note">${t(a('Neck cut-off 40 cm follows the original STOP-Bang; Asian cut-offs for BMI may be lower — judge clinically.','เกณฑ์รอบคอ 40 ซม. ตาม STOP-Bang ต้นฉบับ เกณฑ์ BMI ของเอเชียอาจต่ำกว่า — ใช้ดุลยพินิจ'))}</p>`;
}
function vPsg(){
 const inp=PF.map(([k,l])=>`<div><label>${t(l)}<input type="number" step="any" inputmode="decimal" data-ps="${k}" value="${esc(psg[k]??'')}"></label></div>`).join('');
 const sev=`<div class="tw"><table><tr><th>AHI /h</th><th>${t(a('Severity','ความรุนแรง'))}</th></tr><tr><td>&lt; 5</td><td>${t(a('Normal','ปกติ'))}</td></tr><tr><td>5 – &lt; 15</td><td>${t(a('Mild','เล็กน้อย'))}</td></tr><tr><td>15 – &lt; 30</td><td>${t(a('Moderate','ปานกลาง'))}</td></tr><tr><td>≥ 30</td><td>${t(a('Severe','รุนแรง'))}</td></tr></table></div><p class="note">${t(a('AHI = (apnoeas + hypopnoeas) ÷ hours of sleep. Hypopnoea scoring (≥ 30 % flow drop with ≥ 3 % desaturation or arousal, vs ≥ 4 % desaturation) changes the AHI — note which rule the lab used.','AHI = (apnoea + hypopnoea) ÷ ชั่วโมงที่หลับ การนับ hypopnoea (ลมลด ≥ 30 % ร่วมกับ desaturation ≥ 3 % หรือ arousal เทียบกับ ≥ 4 %) ทำให้ AHI ต่างกัน — ดูว่าห้องตรวจใช้เกณฑ์ใด'))}</p>`;
 const sel=`<ul><li><b>${t(a('Home sleep apnoea test:','Home sleep apnoea test:'))}</b> ${t(a('uncomplicated adults with a high pre-test probability of moderate–severe OSA. A negative or technically poor test needs in-lab PSG.','ผู้ใหญ่ไม่มีโรคร่วมซับซ้อน โอกาสก่อนตรวจสูงของ OSA ปานกลาง–รุนแรง ถ้าผลลบหรือคุณภาพไม่ดี ต้อง PSG'))}</li><li><b>${t(a('In-lab PSG:','PSG ในห้องปฏิบัติการ:'))}</b> ${t(a('significant cardiopulmonary or neuromuscular disease, hypoventilation, opioids, suspected central apnoea, insomnia or parasomnia, prior negative home test.','โรคหัวใจ-ปอด/กล้ามเนื้อ-ประสาทรุนแรง hypoventilation ใช้ opioid สงสัย central apnoea นอนไม่หลับ/parasomnia หรือ home test เคยเป็นลบ'))}</li></ul>`;
 const read=`<ul><li>${t(a('Sleep efficiency, REM and N3 share, arousal index.','ประสิทธิภาพการนอน สัดส่วน REM และ N3 arousal index'))}</li><li>${t(a('AHI overall, REM vs NREM, supine vs non-supine.','AHI รวม REM เทียบ NREM ท่านอนหงายเทียบท่าอื่น'))}</li><li>${t(a('Obstructive vs central vs mixed events.','obstructive / central / mixed'))}</li><li>${t(a('SpO₂ nadir, T90, oxygen desaturation index.','SpO₂ ต่ำสุด T90 ODI'))}</li><li>${t(a('Heart-rhythm findings, limb movements, snoring.','จังหวะหัวใจ การเคลื่อนไหวขา การกรน'))}</li></ul>`;
 return det('psgin','sky',t(a('Enter the study results','ใส่ผลการตรวจ')),`<div class="grid">${inp}</div><div id="psgout">${psgOut()}</div>`,'')
 +det('psgsev','violet',t(a('AHI severity','ระดับความรุนแรงตาม AHI')),sev)
 +det('psgsel','emerald',t(a('Which test?','เลือกตรวจแบบใด')),sel)
 +det('psgread','slate',t(a('What to read in a report','อ่านอะไรในรายงาน')),read);
}
function vTx(){
 return TX.map(([c,ti,items],i)=>det('tx'+i,c,t(ti),'<ul>'+items.map(x=>`<li>${t(x)}</li>`).join('')+'</ul>','')).join('');
}
function vSrc(){
 return `<div class="card"><p><b>${t(a('Based on commonly cited criteria:','อ้างอิงเกณฑ์ที่ใช้กันทั่วไป:'))}</b></p><ul><li>AASM Clinical Practice Guideline — diagnostic testing for adult OSA (2017)</li><li>AASM Manual for the Scoring of Sleep and Associated Events (AHI definitions)</li><li>AASM Clinical Practice Guideline — PAP treatment of OSA (2019)</li><li>AASM / AADSM guideline — oral appliance therapy (2015)</li><li>STOP-Bang: Chung F et al., Anesthesiology 2008; Epworth Sleepiness Scale: Johns MW, Sleep 1991</li><li>Thai guideline: แนวทางการพัฒนาการวินิจฉัยและรักษานอนกรนและโรคหยุดหายใจขณะหลับจากการอุดกั้นในประเทศไทย สำหรับผู้ใหญ่ พ.ศ. 2568 (Supiyaphan P, Sonsuwan N), Thai J Otolaryngol Head Neck Surg 2024;25(2):89- ; <a href="https://he02.tci-thaijo.org/index.php/rcotJ/article/view/274258" target="_blank" rel="noopener">he02.tci-thaijo.org</a></li><li>Berlin Questionnaire: Netzer NC et al., Ann Intern Med 1999;131:485-491</li><li>Modified STOP-Bang: Sangkum L et al., BMC Anesthesiol 2021;21:132, PMID 33906600, <a href="https://doi.org/10.1186/s12871-021-01347-0" target="_blank" rel="noopener">doi:10.1186/s12871-021-01347-0</a></li><li>US FDA — tirzepatide label for OSA (Dec 2024)</li></ul><p class="note">${t(a('Not re-verified line by line against the original documents in this app, and the Thai guideline is summarised in its own tab (surgical chapters not yet). Check the current guideline and local availability before acting. N/A is shown wherever data are missing.','แอปนี้ยังไม่ได้ตรวจเทียบทีละบรรทัดกับเอกสารต้นฉบับ และแนวทางไทยสรุปไว้ในแท็บของตัวเอง (ยังไม่รวมหมวดผ่าตัด) โปรดตรวจแนวทางล่าสุดและความพร้อมใช้ในประเทศก่อนใช้ ข้อมูลที่ไม่มีแสดงเป็น N/A'))}</p></div>`;
}
const narrow=()=>innerWidth<640;
const VIEW={check:vCheck,score:vScore,psg:vPsg,tx:vTx,thai:vThai,src:vSrc};

function render(){
 const y=window.scrollY;
 const dark=document.documentElement.classList.contains('dark');
 const ic=p=>'<svg viewBox="0 0 24 24" aria-hidden="true">'+p+'</svg>';
 const SUN=ic('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'),MOON=ic('<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>');
 const TT=a('Switch theme','สลับธีม');
 document.getElementById('app').innerHTML=
 `<header><div class="top"><button class="pill" data-act="log" aria-label="Changelog" title="Changelog">v${VERSION}</button><button class="pill" data-act="lang">${lang==='en'?'ไทย':'EN'}</button><button class="pill round" data-act="theme" aria-label="${t(TT)}" title="${t(TT)}">${dark?SUN:MOON}</button></div>
 <h1>${t(UI.title)}</h1><div class="sub">${t(UI.sub)}</div><div class="by">Made by Warodom Phaenthong, M.D.</div><div class="disc">${t(UI.disc)}</div></header>
 <nav>${UI.tabs.map(([k,l,c,p,s])=>`<button data-tab="${k}" class="tile ${c}${tab===k?' on':''}" title="${t(l)}" aria-label="${t(l)}">${ic(p)}<span>${narrow()?t(s):t(l)}</span></button>`).join('')}</nav>
 ${VIEW[tab]()}
 ${modal?`<div class="modal" data-act="close"><div>${CHANGELOG.map(([v,d,ls])=>`<h3 style="margin:0">v${v} · ${d}</h3><ul>${ls.map(x=>`<li>${t(x)}</li>`).join('')}</ul>`).join('')}<button class="btn" data-act="close">OK</button></div></div>`:''}`;
 window.scrollTo(0,y);
}
document.addEventListener('toggle',e=>{const k=e.target.dataset&&e.target.dataset.k;if(k){e.target.open?openSet.add(k):openSet.delete(k)}},true);
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-act],[data-tab]');if(!el)return;
 if(el.dataset.tab){tab=el.dataset.tab;render();window.scrollTo(0,0);return}
 const ac=el.dataset.act;
 if(ac==='close'&&e.target!==el&&el.classList.contains('modal'))return;
 if(ac==='lang'){lang=lang==='en'?'th':'en';save()}
 else if(ac==='theme'){const d=document.documentElement.classList.toggle('dark');try{localStorage.setItem('osa-theme',d?'dark':'light')}catch(x){}}
 else if(ac==='log')modal=1;
 else if(ac==='close')modal=null;
 else if(ac==='clear'){checks={};save()}
 render();
});
document.addEventListener('change',e=>{
 const d=e.target.dataset;
 if(d.ck!==undefined){if(e.target.checked)checks[d.ck]=1;else delete checks[d.ck];save();render()}
 else if(d.ber!==undefined){ber[d.ber]=e.target.value===''?null:+e.target.value;render()}
 else if(d.sbmod!==undefined){sbMod=e.target.checked;render()}
 else if(d.st!==undefined){stop[d.st]=e.target.checked;render()}
 else if(d.ess!==undefined){ess[d.ess]=e.target.value===''?null:+e.target.value;render()}
});
document.addEventListener('input',e=>{
 const k=e.target.dataset.ps;if(!k)return;
 psg[k]=e.target.value;document.getElementById('psgout').innerHTML=psgOut();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal){modal=null;render()}});
addEventListener('resize',()=>{const n=narrow();if(n!==lastN){lastN=n;render()}});
let lastN=narrow();
try{const l=document.createElement('link');l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700;800&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap';document.head.appendChild(l)}catch(e){}
render();
</script>
</body>
