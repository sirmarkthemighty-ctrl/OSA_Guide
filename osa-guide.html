<style>
/* Bedside UI tokens (see bronchodilator-src/BEDSIDE-UI.md): slate neutrals, indigo = the one "on" state, soft tints per meaning */
:root{--bg:#f1f5f9;--card:#fff;--inset:#f8fafc;--bd:#e2e8f0;--tx:#1e293b;--mu:#526071;--ac:#4f46e5;--acx:#6366f1;--cr:#fff}
html.dark{--bg:#0b1220;--card:#151f32;--inset:#101a2b;--bd:#263449;--tx:#e2e8f0;--mu:#94a3b8;--ac:#4f46e5;--acx:#818cf8}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
html.dark{color-scheme:dark}
body{color:var(--tx);font:14px/1.45 'IBM Plex Sans','IBM Plex Sans Thai',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.wrap{max-width:1024px;margin:0 auto;padding:12px 16px 40px}
/* tints: --c text, --cb tint background, --cd tint border, --cs solid (on state) */
.indigo{--c:#4338ca;--cb:#eef2ff;--cd:#c7d2fe}.amber{--c:#b45309;--cb:#fffbeb;--cd:#fde68a}.emerald{--c:#047857;--cb:#ecfdf5;--cd:#a7f3d0}.rose{--c:#be123c;--cb:#fff1f2;--cd:#fecdd3}.orange{--c:#c2410c;--cb:#fff7ed;--cd:#fed7aa}.sky{--c:#0369a1;--cb:#f0f9ff;--cd:#bae6fd}.violet{--c:#6d28d9;--cb:#f5f3ff;--cd:#ddd6fe}.teal{--c:#0f766e;--cb:#f0fdfa;--cd:#99f6e4}.slate{--c:#334155;--cb:#f8fafc;--cd:#e2e8f0}
html.dark .indigo{--c:#a5b4fc;--cb:rgba(99,102,241,.12);--cd:rgba(99,102,241,.35)}html.dark .amber{--c:#fcd34d;--cb:rgba(245,158,11,.12);--cd:rgba(245,158,11,.35)}html.dark .emerald{--c:#6ee7b7;--cb:rgba(16,185,129,.12);--cd:rgba(16,185,129,.35)}html.dark .rose{--c:#fda4af;--cb:rgba(244,63,94,.12);--cd:rgba(244,63,94,.35)}html.dark .orange{--c:#fdba74;--cb:rgba(249,115,22,.12);--cd:rgba(249,115,22,.35)}html.dark .sky{--c:#7dd3fc;--cb:rgba(14,165,233,.12);--cd:rgba(14,165,233,.35)}html.dark .violet{--c:#c4b5fd;--cb:rgba(139,92,246,.12);--cd:rgba(139,92,246,.35)}html.dark .teal{--c:#5eead4;--cb:rgba(20,184,166,.12);--cd:rgba(20,184,166,.35)}html.dark .slate{--c:#cbd5e1;--cb:rgba(100,116,139,.12);--cd:rgba(100,116,139,.35)}
header{padding:4px 0 10px;position:relative}
.ts{display:none}@media(max-width:480px){.tl{display:none}.ts{display:inline}}
.res.row b{font-size:inherit}
.top{position:absolute;top:0;right:0;display:flex;gap:6px;align-items:center;height:36px}
h1{margin:0 0 6px;min-height:36px;padding-right:196px;display:flex;align-items:center;font-size:26px;font-weight:800;line-height:1.2;color:var(--tx)}
@media(min-width:640px){h1{font-size:36px;min-height:48px;margin-bottom:8px}.top{height:48px}.sub{font-size:15px}.by{font-size:13px}.disc{font-size:13px}}
@media(min-width:1024px){h1{font-size:44px;min-height:56px}.top{height:56px}.sub{font-size:16px}.by{font-size:14px}.disc{font-size:14px}}
.sub{font-size:13px;color:var(--mu)}
.by{font-size:12px;font-weight:600;color:#4f46e5;margin-top:2px}
.disc{font-size:12px;font-weight:600;color:#b45309}
html.dark .disc{color:#fcd34d}
.pill{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;padding:6px 10px;font:700 10px/1 inherit;font-family:inherit;cursor:pointer;box-shadow:0 1px 2px #0001;display:inline-flex;align-items:center;gap:6px;transition:.15s}
.pill:hover{background:var(--inset)}
.pill-donate svg{color:#f43f5e}.pill-donate:hover{background:#fff1f2;color:#e11d48;border-color:#fecdd3}html.dark .pill-donate:hover{background:rgba(244,63,94,.1);color:#fda4af;border-color:rgba(244,63,94,.3)}.pill .dn{display:none}@media(min-width:640px){.pill .dn{display:inline}}
.top .pill{height:28px;padding-top:0;padding-bottom:0;line-height:1;display:inline-flex;align-items:center}
.pill.round{width:28px;height:28px;padding:0;justify-content:center;color:var(--mu)}
.pill svg,.tile svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
nav{position:sticky;top:0;z-index:30;margin:0 -16px;padding:8px 16px;background:color-mix(in srgb,var(--bg) 95%,transparent);backdrop-filter:blur(8px);display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
@media(min-width:640px){nav{display:flex;flex-wrap:wrap;gap:8px}}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:0;padding:6px 2px;border-radius:8px;border:1px solid var(--cd);background:var(--cb);color:var(--c);font:700 10px/1.15 inherit;font-family:inherit;cursor:pointer;box-shadow:0 1px 2px #0001;text-align:center;transition:.15s}
.tile svg{width:16px;height:16px}
.tile span{min-width:0;max-width:100%;overflow-wrap:anywhere}
.tile:hover{filter:brightness(.97)}
.tile:active{transform:scale(.95)}
.tile.on{background:var(--ac);border-color:var(--ac);color:#fff}
@media(min-width:640px){.tile{flex-direction:row;gap:8px;padding:8px 16px;font-size:13px;white-space:nowrap}.tile svg{width:16px;height:16px}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:10px 0;box-shadow:0 1px 2px #0001}
details.b{border:1px solid var(--cd);border-radius:12px;background:var(--cb);margin:10px 0;overflow:hidden;box-shadow:0 1px 2px #0001}
details.b>summary{cursor:pointer;list-style:none;padding:10px 12px;font-weight:800;font-size:14px;display:flex;gap:8px;align-items:center;color:var(--c)}
details.b>summary::-webkit-details-marker{display:none}
details.b>summary::after{content:'';width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg) translateY(-2px);transition:transform .15s;flex:0 0 auto}
details.b[open]>summary::after{transform:rotate(-135deg)}
details.b>.in{padding:2px 12px 12px;background:var(--card);border-top:1px solid var(--cd)}
.cnt{font-size:10px;font-weight:800;color:var(--c);border:1px solid var(--cd);background:var(--card);border-radius:4px;padding:0 5px;margin-left:auto}
label.ck{display:flex;gap:9px;align-items:flex-start;padding:8px 2px;border-top:1px solid var(--bd);cursor:pointer}
label.ck:first-child{border-top:0}
label.ck input{width:18px;height:18px;margin-top:1px;flex:0 0 auto;accent-color:#4f46e5}
label.ck span small{display:block;color:var(--mu);font-size:11px}
.res{border-radius:10px;padding:10px 12px;margin-top:10px;border:1px solid var(--cd);background:var(--cb);color:var(--c);font-weight:700}
.res b{font-size:20px}
.res small{display:block;font-weight:500;color:var(--tx);margin-top:4px;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.grid label{font-size:11px;font-weight:700;color:var(--mu);display:block}
input[type=number],select{width:100%;margin-top:2px;padding:7px 8px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font:inherit;box-shadow:0 1px 2px #0001}
input:focus,select:focus,button:focus-visible,summary:focus-visible{outline:2px solid #6366f1;outline-offset:1px}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{border:1px solid var(--bd);padding:5px 7px;text-align:left;vertical-align:top}
th{background:var(--inset)}
.tw{overflow-x:auto}
ul{margin:4px 0;padding-left:18px}li{margin:2px 0}
label.ck input.sw{appearance:none;-webkit-appearance:none;width:40px;height:22px;margin:0;border-radius:999px;background:color-mix(in srgb,var(--mu) 45%,var(--card));position:relative;cursor:pointer;transition:background .15s}
label.ck input.sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px #0004;transition:transform .15s}
label.ck input.sw:checked{background:#4f46e5}
label.ck input.sw:checked::after{transform:translateX(18px)}
.strip{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:6px 0 2px}.strip .chip{font-size:11px;padding:2px 7px;margin:0}
.handbox{max-width:780px;width:100%;max-height:92vh;overflow:auto;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px}
.sheet{background:#fff;color:#111;border:1px solid #cbd5e1;border-radius:8px;padding:18px 20px;font-size:13.5px;line-height:1.55}.sheet h2{margin:0;font-size:22px;font-weight:800;color:#1e1b4b}.sheet .hsub{color:#475569;margin-bottom:8px}.sheet h3{margin:12px 0 3px;font-size:14px;font-weight:800;color:#3730a3;border-bottom:1px solid #c7d2fe;padding-bottom:2px}.sheet p{margin:0}.sheet ul{margin:2px 0;padding-left:20px}.sheet li{margin:2px 0}
.sheet .hbox{border:1.5px solid #4f46e5;border-radius:8px;padding:8px 12px;margin:6px 0;background:#eef2ff}.sheet .hr{margin:2px 0}
.sheet .pl{display:flex;flex-wrap:wrap;gap:4px 18px;margin:4px 0}.sheet .ln2{margin:10px 0 0}.sheet .hfoot{margin-top:12px;font-size:11px;color:#475569;border-top:1px solid #cbd5e1;padding-top:6px}
.sumbox{max-width:560px;width:100%}.sumpre{white-space:pre-wrap;word-break:break-word;font:12px/1.5 ui-monospace,Consolas,monospace;background:var(--inset);border:1px solid var(--bd);border-radius:10px;padding:10px;margin:0 0 8px;max-height:55vh;overflow:auto}
@page{size:A4;margin:12mm}
@media print{.wrap>*:not(.sumwrap):not(.handwrap),.noprint{display:none!important}.modal.sumwrap,.modal.handwrap{position:static;background:none;backdrop-filter:none;padding:0;display:block}.handbox{max-height:none;overflow:visible;border:0;padding:0;background:none}.sheet{border:0;padding:0;font-size:12px;line-height:1.45}.sheet h2{font-size:20px}.sumbox{max-width:none}.sumpre{max-height:none;overflow:visible;border:0;background:none;color:#000}body{background:#fff}}
details.b{scroll-margin-top:calc(var(--navh,56px) + 52px)}
details.b>summary .sm{display:flex;gap:10px;align-items:center;min-width:0;flex:1}.ico{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.st{display:flex;flex-direction:column;min-width:0}.st small{font-weight:500;font-size:11px;color:var(--mu);line-height:1.35;margin-top:2px}
.bgs{display:flex;gap:3px;flex-wrap:wrap;justify-content:flex-end;margin-left:6px}.bgs .chip{margin:0;font-size:10px}
.grp{display:flex;align-items:center;gap:8px;margin:18px 2px 0;font-weight:800;font-size:11px;line-height:1;font-family:inherit;color:var(--mu);letter-spacing:.06em;text-transform:uppercase}.grp::after{content:'';flex:1;border-top:1px solid var(--bd)}
.jump{position:sticky;top:var(--navh,56px);z-index:25;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:6px 0;margin:8px 0 0;background:var(--bg)}.jump::-webkit-scrollbar{display:none}
.jump button{flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;border:1px solid var(--cd);background:var(--cb);color:var(--c);border-radius:999px;padding:5px 10px;font-weight:700;font-size:11px;line-height:1;font-family:inherit;cursor:pointer;white-space:nowrap}.jump .ico{width:13px;height:13px}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}.ctl .seg{display:inline-flex;border:1px solid var(--bd);border-radius:8px;overflow:hidden;background:var(--card)}.ctl .seg button{border:0;background:none;color:var(--mu);padding:6px 10px;font-weight:700;font-size:11px;font-family:inherit;cursor:pointer}.ctl .seg button.on{background:var(--ac);color:#fff}
.flow{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin:8px 0}@media(min-width:640px){.flow{grid-template-columns:repeat(3,1fr)}}
.flow button{display:flex;flex-direction:column;gap:2px;text-align:left;border:1px solid var(--cd);background:var(--cb);color:var(--c);border-radius:10px;padding:8px 10px;font-weight:700;font-size:12px;line-height:1.25;font-family:inherit;cursor:pointer}.flow button small{font-weight:500;font-size:10.5px;color:var(--tx);opacity:.85}
.route{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;border-radius:10px;padding:10px 12px;margin:8px 0;border:1px solid var(--cd);background:var(--cb);color:var(--c);font-size:13px;font-weight:700}.route small{display:block;font-weight:500;color:var(--tx);font-size:12px;margin-top:3px}
.cmp{min-width:640px}.cmp td:first-child,.cmp th:first-child{position:sticky;left:0;background:var(--card);font-weight:700}.cmp th:first-child{background:var(--inset)}
.lst .ln{display:block}.lst .ln+.ln{margin-top:5px}
.pill,.btn,.jump button,.ctl .seg button{position:relative}
.pill::before,.btn::before,.jump button::before{content:'';position:absolute;inset:-6px}
.ctl .seg button{min-height:36px}
.lst{list-style:none;margin:0;padding:0}.lst li{margin:0;padding:8px 0;border-top:1px solid var(--bd);line-height:1.55;font-size:13.5px}.lst li:first-child{border-top:0}.lst b{color:var(--tx)}
.lst li.cl{margin:6px 0;padding:8px 10px;border:1px solid var(--cd);background:var(--cb);border-radius:8px}.lst li.cl b{color:var(--c)}
.sg{display:flex;align-items:center;gap:6px;margin:14px 0 2px;font:800 11px/1.2 inherit;font-family:inherit;color:var(--c);letter-spacing:.02em}.sg:first-child{margin-top:8px}
.note{font-size:11px;color:var(--mu)}
.chip{display:inline-block;font-size:10px;font-weight:700;border:1px solid var(--cd);background:var(--cb);color:var(--c);border-radius:4px;padding:1px 4px;margin-right:4px}
.btn{border:1px solid var(--bd);background:var(--card);color:var(--mu);border-radius:8px;padding:6px 12px;font:700 11px inherit;font-family:inherit;cursor:pointer;box-shadow:0 1px 2px #0001}
.btn:hover{background:var(--inset);color:var(--tx)}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.7);backdrop-filter:blur(4px);z-index:50;display:grid;place-items:center;padding:12px;animation:fi .15s}
.modal>div{background:var(--card);border:1px solid var(--bd);border-radius:16px;max-width:520px;width:100%;max-height:85vh;overflow:auto;padding:16px;animation:zi .15s}
@keyframes fi{from{opacity:0}}@keyframes zi{from{transform:scale(.95)}}
@media(min-width:640px){.grid{grid-template-columns:repeat(4,1fr)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

["sky",a("Oral appliance","อุปกรณ์ในช่องปาก"),[G("For snoring with low OSA risk, OSA patients who decline PAP, or as part of multimodality treatment.","สำหรับนอนกรนที่เสี่ยง OSA ต่ำ ผู้ป่วย OSA ที่ปฏิเสธ PAP หรือเป็นส่วนหนึ่งของการรักษาหลายวิธี"),
 G("Adjustable mandibular advancement devices beat non-adjustable ones; start at 50–75 % of maximum protrusion and titrate.","แบบปรับระยะยื่นได้ดีกว่าแบบปรับไม่ได้ เริ่มที่ 50–75 % ของระยะยื่นสูงสุดแล้วปรับเพิ่ม"),
 G("Likelier to help: declines PAP, female, young, low BMI, lower AHI, enough teeth, no jaw-joint disease or severe gum disease, supine-related OSA.","มีแนวโน้มได้ผลดี: ไม่ต้องการ PAP เพศหญิง อายุน้อย BMI ต่ำ AHI ไม่สูง ฟันเพียงพอ ไม่มีโรคข้อต่อขากรรไกรหรือโรคเหงือกรุนแรง supine-related OSA"),
 G("Similar to CPAP for blood pressure, sleepiness and quality of life, but weaker for AHI and oxygen. Watch for jaw, tooth and gum pain, drooling and bite change.","ใกล้เคียง CPAP ในการลดความดัน ความง่วง และคุณภาพชีวิต แต่ลด AHI และออกซิเจนได้น้อยกว่า ติดตามอาการปวดกราม ฟัน เหงือก น้ำลายไหล และการสบฟันเปลี่ยน"),
 G("Tongue-retaining devices suit patients with no teeth or jaw-joint problems, with results equal to or lower than PAP and other oral appliances. Oral appliance plus CPAP together: no recommendation (little data).","อุปกรณ์ยึดรั้งลิ้น (TRD) เหมาะกับผู้ไม่มีฟันหรือมีปัญหาข้อต่อขากรรไกร ผลใกล้เคียงหรือน้อยกว่า PAP และอุปกรณ์ในช่องปากชนิดอื่น ใช้อุปกรณ์ในช่องปากร่วมกับ CPAP: ไม่มีคำแนะนำ (ข้อมูลน้อย)"),
 a("Repeat a sleep study with the appliance in place to confirm the effect.","ตรวจการนอนซ้ำขณะใส่อุปกรณ์เพื่อยืนยันผล")].concat(AASM_OA),"pp. 108–109"],
["teal",a("Upper-airway investigations","การตรวจทางเดินหายใจส่วนบน"),[G("Used to plan non-PAP treatment, above all surgery and oral appliances: nasal assessment (Cottle, anterior rhinoscopy, nasal endoscopy, objective tests such as acoustic rhinometry or peak nasal inspiratory flow where there is a nasal problem), tonsil size and Friedman tongue position.","ใช้วางแผนการรักษาที่ไม่ใช่ PAP โดยเฉพาะผ่าตัดและอุปกรณ์ในช่องปาก: ประเมินจมูก (Cottle, anterior rhinoscopy, ส่องกล้องจมูก, การวัดเชิงวัตถุ เช่น acoustic rhinometry หรือ peak nasal inspiratory flow เมื่อมีปัญหาจมูก) ขนาดทอนซิล และ Friedman tongue position"),
 G("Large tonsils may predict a good UPPP result; Friedman tongue position 3–4 with small tonsils predicts a poor result from UPPP alone.","ทอนซิลโตอาจทำนายผล UPPP ที่ดี; Friedman tongue position 3–4 ร่วมกับทอนซิลเล็กทำนายว่า UPPP อย่างเดียวได้ผลค่อนข้างต่ำ"),
 G("DISE (drug-induced sleep endoscopy): for OSA patients seeking a non-PAP option, especially surgery or an oral appliance. Done in a quiet room with vital-sign and consciousness monitoring. Findings are usually scored with VOTE (velum, oropharyngeal lateral wall, tongue base, epiglottis; direction AP, lateral or concentric; degree 0–2). Complete concentric collapse at the velum predicts a poorer response to upper-airway stimulation, palatal surgery and oral appliances. Limits: differing sedation protocols and scoring, drug risk, desaturation.","DISE (ส่องกล้องขณะหลับด้วยยา): สำหรับผู้ป่วย OSA ที่ต้องการทางเลือกที่ไม่ใช่ PAP โดยเฉพาะผ่าตัดหรืออุปกรณ์ในช่องปาก ทำในห้องเงียบ มีการติดตามสัญญาณชีพและระดับความรู้สึกตัว นิยมให้คะแนนแบบ VOTE (velum, ผนังคอหอยด้านข้าง, โคนลิ้น, epiglottis; ทิศทาง AP, lateral, concentric; ระดับ 0–2) complete concentric collapse ที่ velum ทำนายผลที่ด้อยกว่าของการกระตุ้นทางเดินหายใจส่วนบน การผ่าตัดเพดานอ่อน และอุปกรณ์ในช่องปาก ข้อจำกัด: โปรโตคอลยาและระบบให้คะแนนต่างกัน ความเสี่ยงจากยา ออกซิเจนต่ำ"),
 G("Awake endoscopy with Müller manoeuvre: now less popular, as it does not predict surgical success.","ส่องกล้องขณะตื่นร่วมกับ Müller maneuver: นิยมลดลง เพราะไม่ช่วยทำนายผลผ่าตัด"),
 G("Lateral cephalometry and CBCT help plan jaw and facial-skeleton surgery or oral appliances; CBCT is not recommended for screening (limited data, cost). Submental ultrasound: data still limited. Video fluoroscopy, manometry, acoustic reflection: no recommendation.","Lateral cephalometry และ CBCT ช่วยวางแผนผ่าตัดกระดูกขากรรไกรและใบหน้าหรืออุปกรณ์ในช่องปาก ไม่แนะนำ CBCT เพื่อคัดกรอง (ข้อมูลจำกัด ค่าใช้จ่ายสูง) อัลตราซาวด์ใต้คาง: ข้อมูลยังจำกัด video fluoroscopy, manometry, acoustic reflection: ไม่มีคำแนะนำ")],"pp. 105–107"],
["violet",a("Minimally invasive procedures","หัตถการรุกล้ำน้อย"),[G("Under local anaesthetic, mostly outpatient. For snoring with low OSA risk, OSA patients who decline PAP, oral appliance and surgery, or as part of multimodality treatment.","ทำภายใต้ยาชาเฉพาะที่ ส่วนใหญ่ผู้ป่วยนอก สำหรับนอนกรนที่เสี่ยง OSA ต่ำ ผู้ป่วย OSA ที่ปฏิเสธ PAP อุปกรณ์ในช่องปาก และผ่าตัด หรือเป็นส่วนหนึ่งของการรักษาหลายวิธี"),
 G("Radiofrequency: nose (turbinates; low risk, effective), soft palate (less snoring, safe, but snoring may return over time), tongue base, or several levels.","คลื่นความถี่วิทยุ: จมูก (turbinate ความเสี่ยงต่ำ ได้ผลดี) เพดานอ่อน (ลดเสียงกรน ปลอดภัย แต่อาจกลับมากรนในระยะยาว) โคนลิ้น หรือหลายตำแหน่ง"),
 G("Er:YAG laser: for snoring without apnoea or mild OSA; well tolerated; snoring may recur and AHI/RDI may fall little.","Er:YAG laser: สำหรับกรนที่ไม่มีหยุดหายใจหรือ OSA ไม่รุนแรง ทนได้ดี อาจกรนกลับมา และ AHI/RDI อาจลดไม่มาก"),
 G("Palatal pillar implants: reduce snoring and help mild OSA, few complications.","ฝังไหมพิลล่าร์ที่เพดานอ่อน: ลดเสียงกรนและช่วย OSA ระดับน้อย ภาวะแทรกซ้อนน้อย"),
 G("Not recommended: CO₂ laser LAUP (low success, high complications) and injection snoreplasty (long-term efficacy and safety not shown).","ไม่แนะนำ: CO₂ laser LAUP (สำเร็จต่ำ แทรกซ้อนสูง) และการฉีดสารที่เพดานอ่อน (ยังไม่มีข้อมูลประสิทธิผลและความปลอดภัยระยะยาว)")],"pp. 109–110"],
["rose",a("Surgery","การผ่าตัด"),[G("For snorers, or OSA patients who decline CPAP. Likelier to respond: declines PAP, young, BMI < 40, an obstructing structure (large tonsils, long uvula, chronic nasal obstruction, septal deviation, turbinate hypertrophy, jaw deformity), no serious comorbidity that rules out surgery. Treat the site that is blocked (single or multiple levels); may be part of multimodality treatment.","สำหรับนอนกรนหรือผู้ป่วย OSA ที่ปฏิเสธ CPAP มีแนวโน้มตอบสนองดี: ไม่ต้องการ PAP อายุน้อย BMI < 40 มีโครงสร้างอุดกั้น (ทอนซิลโต ลิ้นไก่ยาว คัดจมูกเรื้อรัง ผนังกั้นจมูกคด เทอร์บิเนตโต ขากรรไกรผิดรูป) ไม่มีโรคร่วมร้ายแรงที่ผ่าตัดไม่ได้ ผ่าตัดให้ตรงตำแหน่งที่อุดกั้น (ตำแหน่งเดียวหรือหลายระดับ) อาจเป็นส่วนหนึ่งของการรักษาหลายวิธี"),
 G("Nasal surgery (turbinoplasty, septoplasty, nasal valve, polyps): for blocked nose with snoring, or CPAP not tolerated because of the nose. Reduces sleepiness and snoring, improves quality of life, may help CPAP use and lower pressure; effect on AHI unclear; usually combined with other treatment.","ผ่าตัดจมูก (turbinoplasty, septoplasty, nasal valve, ริดสีดวงจมูก): สำหรับคัดจมูกร่วมกับกรน หรือใช้ CPAP ไม่ได้เพราะจมูก ลดง่วงและกรน คุณภาพชีวิตดีขึ้น อาจช่วยให้ใช้ CPAP ได้ดีขึ้นและใช้แรงดันลดลง ผลต่อ AHI ยังไม่ชัดเจน มักทำร่วมกับวิธีอื่น"),
 G("Tonsillectomy: clearly enlarged tonsils or recurrent tonsillitis; with very large tonsils it alone often cures OSA. Risks: bleeding, pain, post-obstructive pulmonary oedema. Mostly combined with palatal surgery.","ตัดทอนซิล: ทอนซิลโตชัดเจนหรือติดเชื้อบ่อย ถ้าทอนซิลโตมากอาจหายจาก OSA ได้ด้วยวิธีนี้อย่างเดียว ความเสี่ยง: เลือดออก ปวด น้ำท่วมปอดหลังการอุดกั้น มักทำร่วมกับผ่าตัดเพดานอ่อน"),
 G("Palate and pharynx: for obstruction at uvula, soft palate and pharynx. Uvulopalatoplasty (long, low soft palate and long uvula). UPPP does best with fairly large tonsils, long uvula, non-large tongue and moderate BMI (Friedman stage 1–2). Newer techniques are common in Thailand (anterior palatoplasty / modified CAPSO, barbed UPPP, expansion sphincter pharyngoplasty), chosen by DISE pattern (e.g. anterior palatoplasty for AP velum collapse; soft-palate webbing flap for lateral collapse). Adverse effects: velopharyngeal insufficiency, swallowing problems, voice change, throat irritation and dryness.","เพดานอ่อนและคอหอย: สำหรับการอุดกั้นที่ลิ้นไก่ เพดานอ่อน คอหอย Uvulopalatoplasty (เพดานอ่อนยาว/ต่ำ ลิ้นไก่ยาว) UPPP ได้ผลดีเมื่อทอนซิลค่อนข้างใหญ่ ลิ้นไก่ยาว ลิ้นไม่โต BMI ไม่มาก (Friedman stage 1–2) เทคนิคใหม่ที่ใช้มากขึ้นในไทย (anterior palatoplasty / modified CAPSO, barbed UPPP, expansion sphincter pharyngoplasty) เลือกตามรูปแบบจาก DISE (เช่น anterior palatoplasty สำหรับ AP velum collapse; soft palate webbing flap สำหรับ lateral collapse) ผลข้างเคียง: velopharyngeal insufficiency กลืนลำบาก เสียงเปลี่ยน ระคายคอ คอแห้ง"),
 G("Tongue base, hypopharynx, larynx (genioglossal advancement, tongue suspension, midline partial glossectomy, lingual tonsillectomy, robotic surgery, hyoid suspension): results are uncertain with complication risk; use carefully, mostly together with surgery at other sites.","โคนลิ้น คอหอยส่วนล่าง กล่องเสียง (genioglossal advancement, tongue suspension, ตัดโคนลิ้นบางส่วนตรงกลาง, lingual tonsillectomy, หุ่นยนต์ช่วยผ่าตัด, hyoid suspension): ผลยังไม่แน่นอนและมีความเสี่ยงแทรกซ้อน ควรใช้อย่างระมัดระวัง ส่วนใหญ่ใช้ร่วมกับการผ่าตัดตำแหน่งอื่น"),
 G("Jaw / skeletal surgery: maxillomandibular advancement (MMA) for severe OSA that cannot use PAP with a skeletal abnormality; the updated Stanford algorithm allows MMA before soft-tissue surgery; also after failed or relapsed surgery, or DISE collapse at both velum and oropharynx. Reported success 85.5 %, cure 38.5 %; major surgery, usually needs orthodontics, long recovery, high risk and cost. Maxillary expansion (narrow, high-arch palate; DOME when nasal obstruction coexists) lowered disease severity. Genioglossus advancement: chin numbness or front-tooth root injury possible; usually combined.","ผ่าตัดกระดูกขากรรไกร: เลื่อนขากรรไกรบนล่าง (MMA) สำหรับ OSA รุนแรงที่ใช้ PAP ไม่ได้ร่วมกับโครงสร้างกระดูกผิดปกติ แนวทาง Stanford ฉบับปรับปรุงอาจทำ MMA ก่อนผ่าตัดเนื้อเยื่ออ่อน หรือทำหลังผ่าตัดอื่นล้มเหลว/กลับเป็นซ้ำ หรือ DISE พบการยุบทั้ง velum และ oropharynx รายงานสำเร็จ 85.5 % หายขาด 38.5 % เป็นผ่าตัดใหญ่ มักต้องจัดฟันร่วม พักฟื้นนาน เสี่ยงและค่าใช้จ่ายสูง ขยายขากรรไกรบน (เพดานแคบ/สูง; DOME เมื่อมีคัดจมูกร่วม) ลดความรุนแรงของโรคได้ เลื่อนกระดูกคาง (genioglossus advancement): อาจชาคางหรือกระทบรากฟันหน้า มักทำร่วมกับวิธีอื่น"),
 G("Upper-airway (hypoglossal nerve) stimulation: BMI < 40, declines or cannot use PAP, AHI 15–100 with central apnoea ≤ 25 %, and no complete concentric velum collapse on DISE. Lowers AHI, sleepiness and snoring and improves quality of life without serious surgical harm. Only one system is approved by the US FDA and the Thai FDA; indications may change, so follow updates.","การกระตุ้นเส้นประสาท hypoglossal: BMI < 40 ปฏิเสธหรือใช้ PAP ไม่ได้ AHI 15–100 โดย central apnoea ไม่เกิน 25 % และไม่พบ complete concentric collapse ที่เพดานอ่อนจาก DISE ลด AHI ความง่วง เสียงกรน และคุณภาพชีวิตดีขึ้น โดยไม่พบอันตรายจากผ่าตัดที่รุนแรง มีเพียงระบบเดียวที่ได้รับการรับรองจาก US FDA และ อย. ไทย ข้อบ่งชี้อาจเปลี่ยน ควรติดตามข้อมูล"),
 G("Tracheostomy: very effective but only for patients who failed other treatments and have significant comorbidity; risk of aspiration through the stoma.","เจาะคอ: ได้ผลดีมาก แต่สำหรับผู้ที่ล้มเหลวจากวิธีอื่นและมีโรคร่วมสำคัญ เสี่ยงสำลักผ่านรูเจาะคอ"),
 G("Multilevel airway surgery: lowers AHI significantly; success 60.2 % by Sher criteria (AHI down ≥ 50 % and below 20 after surgery).","ผ่าตัดทางเดินหายใจหลายระดับ: ลด AHI ได้อย่างมีนัยสำคัญ สำเร็จ 60.2 % ตามเกณฑ์ Sher (AHI ลด ≥ 50 % และเหลือต่ำกว่า 20 หลังผ่าตัด)"),
 G("Bariatric surgery: Thai obesity-surgery guideline 2021 advises BMI ≥ 32.5 with complications (after full medical treatment) or ≥ 37.5 without; reported OSA remission about 65 %.","ผ่าตัดกระเพาะ: แนวทางไทยปี 2564 แนะนำ BMI ≥ 32.5 ร่วมกับโรคแทรกซ้อน (หลังรักษาเต็มที่) หรือ ≥ 37.5 ถ้าไม่มี รายงานโรคหายประมาณ 65 %")].concat(AASM_SURG),"pp. 110–114"],
["amber",a("Medicines and other devices","ยาและอุปกรณ์อื่น"),[G("No drug is approved to treat OSA itself. Treat nasal disease (intranasal steroid; short-term topical decongestant only). Weight-loss drugs (liraglutide, orlistat, phentermine, empagliflozin) and tirzepatide lowered AHI in obese patients.","ยังไม่มียาที่รับรองให้รักษา OSA โดยตรง รักษาโรคจมูก (สเตียรอยด์พ่นจมูก ยาหดหลอดเลือดเฉพาะที่ใช้ระยะสั้น) ยาลดน้ำหนัก (liraglutide, orlistat, phentermine, empagliflozin) และ tirzepatide ลด AHI ในผู้ป่วยอ้วน"),
 a("Tirzepatide: approved by the US FDA (2024) for moderate–severe OSA with obesity; check local availability.","Tirzepatide: US FDA อนุมัติ (2024) สำหรับ OSA ปานกลาง–รุนแรงร่วมกับโรคอ้วน; ตรวจสอบการมีใช้ในประเทศ"),
 G("Residual sleepiness on well-used PAP with other causes excluded: modafinil, armodafinil or solriamfetol may help.","ยังง่วงทั้งที่ใช้ PAP เพียงพอและตัดสาเหตุอื่นแล้ว: modafinil, armodafinil หรือ solriamfetol อาจช่วย"),
 G("No recommendation (data unclear): pharyngeal-dilator drugs, arousal-threshold drugs (benzodiazepines, Z-drugs, trazodone), acetazolamide, acupuncture.","ไม่มีคำแนะนำ (ข้อมูลยังไม่ชัดเจน): ยาเพิ่มการทำงานกล้ามเนื้อขยายคอหอย ยาเพิ่ม arousal threshold (benzodiazepine, Z-drug, trazodone) acetazolamide การฝังเข็ม"),
 a("No drug replaces PAP for airway collapse; avoid sedative-hypnotics where possible.","ไม่มียาที่ทดแทน PAP; หลีกเลี่ยงยานอนหลับถ้าเป็นไปได้"),
 G("Night oxygen can help when pressure is adequate but hypoxaemia persists (COPD, heart failure).","ออกซิเจนตอนนอนอาจช่วยเมื่อแรงดันเพียงพอแต่ยังมีออกซิเจนต่ำ (COPD หัวใจวาย)"),
 G("Myofunctional therapy (upper-airway muscle and oropharyngeal exercises): for snoring, mild OSA or as part of multimodality treatment; reported to lower AHI and sleepiness, but needs sustained effort and long-term data are limited.","การฝึกกล้ามเนื้อ (ฝึกกล้ามเนื้อทางเดินหายใจส่วนบน/คอหอย): สำหรับนอนกรน OSA ไม่รุนแรง หรือเป็นส่วนหนึ่งของการรักษาหลายวิธี มีรายงานลด AHI และความง่วง แต่ต้องทำอย่างต่อเนื่อง และข้อมูลระยะยาวยังจำกัด"),

const STOPMAP=[[0,['sx0'],a('Snoring','กรนดัง')],[1,['dx0','dx1','dx3'],a('Tired','เหนื่อย/ง่วง')],[2,['sx1'],a('Observed apnoea','มีคนเห็นหยุดหายใจ')],[3,['cm0'],a('Pressure (hypertension)','ความดันสูง')],[6,['sg1'],a('Neck > 40 cm','รอบคอ > 40 ซม.')]];
function bmiOf(){const w=num(body.w),hh=num(body.h);return(w&&hh&&hh>0)?w/((hh/100)*(hh/100)):null}
let bodyMsg='';
const stopCut=()=>sbKku?{b:23,a:40,n:35,ge:true}:{b:sbMod?30:35,a:50,n:40,ge:false};
const pass=(v,c)=>stopCut().ge?v>=c:v>c;

 o+=b===null?row('slate','<b>BMI:</b> N/A — '+t(a('enter weight and height','ใส่น้ำหนักและส่วนสูง'))):row(pass(b,cut)?'rose':'emerald','<b>BMI '+b.toFixed(1)+' kg/m²</b> — STOP-Bang BMI '+op+' '+cut+': '+yn(pass(b,cut))+(sbKku?' ('+t(a('modified, Khon Kaen','ปรับปรุง ขอนแก่น'))+')':sbMod?' ('+t(a('modified Thai cut-off','เกณฑ์ปรับปรุงของไทย'))+')':'')+'; '+t(a('Asian obesity cut-off ≥ 25','เกณฑ์โรคอ้วนเอเชีย ≥ 25'))+': '+yn(b>=25));
 o+=age===null?row('slate','<b>'+t(a('Age','อายุ'))+':</b> N/A'):row(pass(age,C.a)?'rose':'emerald','<b>'+t(a('Age','อายุ'))+' '+age+'</b> — STOP-Bang '+t(a('age','อายุ'))+' '+op+' '+C.a+': '+yn(pass(age,C.a)));
 o+=nk===null?row('slate','<b>'+t(a('Neck','รอบคอ'))+':</b> N/A'):row(pass(nk,C.n)?'rose':'emerald','<b>'+t(a('Neck','รอบคอ'))+' '+nk+' cm</b> — STOP-Bang '+op+' '+C.n+' cm: '+yn(pass(nk,C.n)));
 o+=!body.sex?row('slate','<b>'+t(a('Sex','เพศ'))+':</b> N/A'):row(body.sex==='m'?'rose':'emerald','<b>'+t(a('Sex','เพศ'))+'</b> — STOP-Bang '+t(a('male','เพศชาย'))+': '+yn(body.sex==='m'));
 return o+(bodyMsg?'<p class="note" style="margin:8px 0 0"><b>'+bodyMsg+'</b></p>':'');
}
function fillStopFromBody(){

 if(nk!==null){stop[6]=pass(nk,stopCut().n);done.push(t(a('neck','รอบคอ')))}
 if(body.sex){stop[7]=body.sex==='m';done.push(t(a('sex','เพศ')))}
 bodyMsg=done.length?t(a('Filled in STOP-Bang: ','เติมใน STOP-Bang แล้ว: '))+done.join(', ')+'.':t(a('Nothing to fill yet: enter at least one measurement.','ยังไม่มีข้อมูลให้เติม: กรอกอย่างน้อยหนึ่งค่า'));

}
function sendToScores(){

 let berN=0;if(checks.cm0){ber[7]=0;berN++}if(checks.dx6){ber[6]=0;berN++}
 fromCheck={done,berN};
}

}

const STOPN=[a("Snoring","กรน"),a("Tired","เหนื่อย/ง่วง"),a("Observed apnoea","มีคนเห็นหยุดหายใจ"),a("Pressure","ความดันสูง"),a("BMI","BMI"),a("Age > 50","อายุ > 50"),a("Neck > 40 cm","รอบคอ > 40"),a("Male","เพศชาย")];

function psgNums(){
 const g=k=>num(psg[k]);const tst=g('tst'),oa=g('oa'),ca=g('ca'),hy=g('hy'),home=isHome();
 const o={tst,nad:g('nad'),t90:g('t90'),sup:g('sup'),non:g('non'),home,ahi:null,rdi:null,se:null,rem:home?null:g('rem'),nrem:home?null:g('nrem'),odi:g('odi'),arx:home?null:g('arx'),rule:psg.rule||''};
 if(tst&&tst>0&&oa!==null&&ca!==null&&hy!==null){
  o.ahi=(oa+ca+hy)/tst;o.sev=o.ahi<5?0:o.ahi<15?1:o.ahi<30?2:3;o.cen=(oa+ca+hy)?ca/(oa+ca+hy)*100:0;
  const rr=home?null:g('rera');if(rr!==null)o.rdi=(oa+ca+hy+rr)/tst;
  const tb=home?null:g('tib');if(tb&&tb>0)o.se=tst/tb*100;
 }
 o.remPred=o.rem!==null&&o.nrem!==null&&o.rem>=5&&o.rem>=2*o.nrem;
 return o;
}
const SEVC=['emerald','amber','orange','rose'];
const LS='osa-state';
function saveAll(){try{localStorage.setItem(LS,JSON.stringify({checks,stop,sbMod,sbKku,ess,ber,psg,pap,body}))}catch(e){}}
function loadAll(){try{const s=JSON.parse(localStorage.getItem(LS)||'null');if(!s)return;checks=s.checks||{};stop=s.stop||{};sbMod=!!s.sbMod;sbKku=!!s.sbKku;if(Array.isArray(s.ess)&&s.ess.length===8)ess=s.ess;if(Array.isArray(s.ber)&&s.ber.length===9)ber=s.ber;psg=s.psg||{};pap=s.pap||{};body=s.body||{}}catch(e){}}
function resetAll(){checks={};stop={};sbMod=false;sbKku=false;ess=Array(8).fill(null);ber=Array(9).fill(null);psg={};pap={};body={};fromCheck=null;confirmNew=false;saveAll()}
function strip(){
 const chips=[];const anyStop=Object.values(stop).some(Boolean);
 if(anyStop){const r=stopRisk();chips.push([r.c,'STOP-Bang '+r.n+'/8'])}

 const b=berRes();if(b.done)chips.push([b.n>=2?'rose':'emerald','Berlin '+b.n+'/3']);
 const p=psgNums();if(p.ahi!==null)chips.push([SEVC[p.sev],(p.home?'REI ':'AHI ')+p.ahi.toFixed(1)]);

}

 if(tot){L.push('');L.push(t(a("Checklist","เช็กลิสต์"))+': '+tot+'/'+GROUPS.reduce((n,g)=>n+g[3].length,0));

 const bm=bmiOf();if(bm!==null||body.age||body.neck||body.sex){L.push('');L.push(t(a('Measurements','ค่าร่างกาย'))+': '+[bm!==null?'BMI '+bm.toFixed(1):null,body.age?t(a('age','อายุ'))+' '+body.age:null,body.neck?t(a('neck','รอบคอ'))+' '+body.neck+' cm':null,body.sex?(body.sex==='m'?t(a('male','ชาย')):t(a('female','หญิง'))):null].filter(Boolean).join(', '))}
 L.push('');
 const r=stopRisk(),anyStop=Object.values(stop).some(Boolean);
 L.push('STOP-Bang'+(sbMod?' ('+t(a("modified, Thai","แบบปรับปรุง ไทย"))+')':sbKku?' ('+t(a("modified, Khon Kaen","แบบปรับปรุง ขอนแก่น"))+')':'')+': '+(anyStop?r.n+'/8 — '+t(RISKTXT[r.k])+' ['+STOPN.filter((_,i)=>stop[i]).map(x=>t(x)).join(', ')+']':NA));
 const e=essRes();L.push('Epworth: '+(e?e.s+'/24 — '+t(ESSTXT[e.k]):NA));
 const b=berRes();L.push('Berlin: '+(b.done?b.n+'/3 '+t(a("categories positive","หมวดเป็นบวก"))+' — '+(b.n>=2?t(a("high risk","เสี่ยงสูง")):t(a("low risk","เสี่ยงต่ำ"))):NA));
 const p=psgNums();
 if(p.ahi!==null){const f=v=>v===null?NA:v;
  L.push((p.home?'Home sleep test: REI ':'PSG: AHI ')+p.ahi.toFixed(1)+'/h — '+t(SEVN[p.sev])+'; '+(p.home?t(a('monitoring time','เวลาที่บันทึก')):'TST')+' '+p.tst+' h;'+(p.rdi!==null?' RDI '+p.rdi.toFixed(1)+'/h;':'')+(p.se!==null?' '+t(a('efficiency','ประสิทธิภาพ'))+' '+p.se.toFixed(0)+' %;':'')+(p.remPred?' '+t(a('REM-predominant','เด่นช่วง REM'))+' (REM '+p.rem+' / NREM '+p.nrem+');':'')+(p.odi!==null?' ODI '+p.odi+'/h;':'')+(p.arx!==null?' '+t(a('arousal index','arousal index'))+' '+p.arx+'/h;':'')+(p.rule?' '+t(a('hypopnoea rule','เกณฑ์ hypopnoea'))+' '+p.rule+';':'')+' '+t(a("central share","สัดส่วน central"))+' '+p.cen.toFixed(0)+' %; SpO2 '+t(a("nadir","ต่ำสุด"))+' '+f(p.nad)+' %; T90 '+f(p.t90)+' %; '+t(a("supine / non-supine AHI","AHI ท่านอนหงาย / ท่านอื่น"))+' '+f(p.sup)+' / '+f(p.non));
 }else L.push('PSG/sleep test: '+NA);
 if(Object.values(pap).some(v=>v!==''&&v!=null)){const f=k=>(pap[k]===''||pap[k]==null)?NA:pap[k];
  L.push(t(a("PAP follow-up","ติดตาม PAP"))+': '+t(a("use","ชั่วโมงใช้"))+' '+f('use')+' h/'+t(a("night","คืน"))+'; '+f('pct')+' % '+t(a("nights ≥ 4 h","คืนที่ ≥ 4 ชม."))+'; '+t(a("residual AHI","AHI ที่เหลือ"))+' '+f('rah')+'; '+t(a("leak","ลมรั่ว"))+' '+({ok:t(a("acceptable","ยอมรับได้")),high:t(a("high","สูง"))}[pap.leak]||NA)+'; '+t(a("sleepiness","ความง่วง"))+' '+({none:t(a("none","ไม่มี")),persists:t(a("persists","ยังมี"))}[pap.sl]||NA));
 }
 return L.join('\n');
}

const HAND={
 title:a("Living with sleep apnoea","อยู่กับโรคหยุดหายใจขณะหลับ"),
 sub:a("Information for patients","ข้อมูลสำหรับผู้ป่วย"),
 blocks:[
  [a("What is sleep apnoea?","โรคหยุดหายใจขณะหลับคืออะไร"),'p',a("Obstructive sleep apnoea (OSA) means the throat narrows or closes during sleep, so breathing pauses or becomes shallow many times a night. Your brain wakes you briefly to breathe again. You may not remember it, but your sleep is broken and your oxygen level can drop.","โรคหยุดหายใจขณะหลับจากการอุดกั้น (OSA) คือภาวะที่ทางเดินหายใจส่วนบนแคบหรือปิดขณะหลับ ทำให้หยุดหายใจหรือหายใจแผ่วหลายครั้งในแต่ละคืน สมองจะตื่นขึ้นสั้นๆ เพื่อให้หายใจต่อ คุณอาจจำไม่ได้ แต่การนอนถูกรบกวนและระดับออกซิเจนอาจลดลง")],
  [a("Why treat it?","ทำไมต้องรักษา"),'p',a("Untreated, OSA can cause daytime sleepiness, accidents (including when driving), poorer concentration and quality of life. It is linked with high blood pressure, irregular heartbeat, heart disease and stroke.","หากไม่รักษา OSA อาจทำให้ง่วงตอนกลางวัน เกิดอุบัติเหตุ (รวมถึงขณะขับรถ) สมาธิและคุณภาพชีวิตแย่ลง และสัมพันธ์กับความดันโลหิตสูง หัวใจเต้นผิดจังหวะ โรคหัวใจ และโรคหลอดเลือดสมอง")],
  [a("What you can do","สิ่งที่ทำได้"),'ul',[
   a("Go to bed and get up at regular times, and sleep at least 7 hours.","เข้านอนและตื่นเป็นเวลา และนอนอย่างน้อย 7 ชั่วโมง"),
   a("Avoid alcohol, sleeping pills and other sedatives close to bedtime, unless your doctor has told you to take them.","หลีกเลี่ยงแอลกอฮอล์ ยานอนหลับ และยากดประสาทอื่นๆ ใกล้เวลานอน เว้นแต่แพทย์สั่ง"),
   a("If you are overweight, losing weight helps. A supervised diet and exercise programme works better than advice alone.","ถ้าน้ำหนักเกิน การลดน้ำหนักช่วยได้ โปรแกรมอาหารและออกกำลังกายที่มีผู้ดูแลได้ผลดีกว่าคำแนะนำอย่างเดียว"),
   a("Sleep on your side if your doctor says your breathing problems happen mostly when you lie on your back.","นอนตะแคงถ้าแพทย์บอกว่าปัญหาการหายใจเกิดเมื่อนอนหงายเป็นหลัก"),
   a("Treat a blocked nose, for example from allergy, and do not smoke.","รักษาอาการคัดจมูก เช่น จากภูมิแพ้ และไม่สูบบุหรี่")]],
  [a("If you use a CPAP machine","ถ้าคุณใช้เครื่อง CPAP"),'ul',[
   a("Use it every night and all night. The goal is at least 4 hours a night, on more than 7 nights out of 10. More is better.","ใช้ทุกคืนและตลอดคืน เป้าหมายคืออย่างน้อย 4 ชั่วโมงต่อคืน และใช้มากกว่า 7 คืนใน 10 คืน ยิ่งใช้นานยิ่งดี"),
   a("Do not stop because you feel better. The machine controls the problem only while you use it.","อย่าหยุดใช้เพราะรู้สึกดีขึ้น เครื่องควบคุมปัญหาได้เฉพาะเมื่อใช้งาน"),
   a("A leaking mask, dry mouth or nose, skin marks or a blocked nose are common and can usually be fixed (refitting the mask, a heated humidifier, a chin strap, nose treatment). Tell your clinic early instead of stopping.","หน้ากากรั่ว ปากหรือจมูกแห้ง รอยกดที่ผิว หรือคัดจมูก พบได้บ่อยและมักแก้ได้ (ปรับหน้ากาก ใช้เครื่องทำความชื้น สายรัดคาง รักษาจมูก) แจ้งคลินิกแต่เนิ่นๆ แทนการหยุดใช้"),

  [a("Driving and safety","การขับรถและความปลอดภัย"),'p',a("Do not drive or use machinery when you feel sleepy. If sleepiness comes on while driving, stop in a safe place and rest. Tell your doctor if you have nearly had an accident.","ห้ามขับรถหรือใช้เครื่องจักรเมื่อรู้สึกง่วง ถ้าง่วงขณะขับรถ ให้จอดในที่ปลอดภัยและพัก แจ้งแพทย์หากเกือบเกิดอุบัติเหตุ")],
  [a("Follow-up","การติดตามผล"),'p',a("You will be reviewed within the first 1–2 months of treatment and then at least once a year. Come sooner if your symptoms return, your weight changes a lot, or you have new health problems.","คุณจะได้รับการติดตามภายใน 1–2 เดือนแรกของการรักษา และอย่างน้อยปีละครั้ง มาก่อนนัดถ้าอาการกลับมา น้ำหนักเปลี่ยนมาก หรือมีโรคใหม่")]],
 plan:a("Your plan (tick with your doctor)","แผนการรักษาของคุณ (ติ๊กร่วมกับแพทย์)"),
 planItems:[a("CPAP / PAP machine","เครื่อง CPAP / PAP"),a("Oral appliance (from a dentist)","อุปกรณ์ในช่องปาก (จากทันตแพทย์)"),a("Weight loss","ลดน้ำหนัก"),a("Sleep on your side","นอนตะแคง"),a("Nose treatment","รักษาจมูก"),a("Referral (surgery or sleep specialist)","ส่งต่อ (ผ่าตัดหรือผู้เชี่ยวชาญด้านการนอน)"),a("Other:","อื่นๆ:")],
 clinic:a("Clinic and phone","คลินิกและเบอร์โทร"),next:a("Next visit","นัดครั้งต่อไป"),
 foot:a("General information for patients. It does not replace the advice of your doctor. Prepared with the OSA Guide by Warodom Phaenthong, M.D.","ข้อมูลทั่วไปสำหรับผู้ป่วย ไม่ทดแทนคำแนะนำของแพทย์ จัดทำด้วย OSA Guide โดย Warodom Phaenthong, M.D.")
};
function handResults(hl){
 const th=hl==='th',p=psgNums(),e=essRes(),sv=[a("normal","ปกติ"),a("mild","เล็กน้อย"),a("moderate","ปานกลาง"),a("severe","รุนแรง")];
 const L=[];
 L.push([th?'ผลการตรวจการนอนหลับ':'Your sleep test',p.ahi!==null?(p.home?'REI ':'AHI ')+p.ahi.toFixed(1)+(th?' ครั้งต่อชั่วโมง — OSA ระดับ':' events an hour — ')+(th?sv[p.sev].th:sv[p.sev].en+' sleep apnoea')+(p.sev===0?(th?' (ไม่เข้าเกณฑ์)':' (below the diagnostic level)'):''):'—']);
 L.push([th?'คะแนนความง่วง (Epworth)':'Your sleepiness score (Epworth)',e?e.s+(th?' จาก 24 (เกิน 10 หมายถึงง่วงมากกว่าปกติ)':' out of 24 (above 10 means sleepier than usual)'):'—']);

/* PAP follow-up check: Thai guideline pp. 104-105, 116; AASM 2019 good-practice statement on follow-up data */
function papOut(){
 const g=k=>num(pap[k]);const u=g('use'),pc=g('pct'),ra=g('rah');
 const row=(c,txt)=>'<div class="res row '+c+'" style="font-weight:500;font-size:13px;margin-top:8px">'+txt+'</div>';
 let o='';
 if(u===null||pc===null)o+=row('slate','<b>'+t(a("Use","การใช้"))+':</b> N/A — '+t(a("enter average hours and % of nights ≥ 4 h","ใส่ชั่วโมงเฉลี่ยและ % ของคืนที่ใช้ ≥ 4 ชม.")));
 else if(u>=4&&pc>70)o+=row('emerald','<b>'+t(a("Use","การใช้"))+':</b> '+t(a("meets the Thai guideline target (≥ 4 h a night averaged over all days, on > 70 % of days). Encourage whole-night use, especially in severe OSA.","ถึงเป้าตามแนวทางไทย (เฉลี่ย ≥ 4 ชม./คืน นับทุกวัน และใช้ > 70 % ของวัน) แนะนำให้ใช้ทั้งคืน โดยเฉพาะ OSA รุนแรง")));
 else o+=row('orange','<b>'+t(a("Use","การใช้"))+':</b> '+t(a("below target. Ask why; fix mask fit, pressure comfort, dry mouth or nose (heated humidifier, chin strap, nasal treatment), repeat education, and add behavioural or telemonitoring support.","ต่ำกว่าเป้า ถามสาเหตุ แก้หน้ากากไม่พอดี ความดันไม่สบาย ปาก/จมูกแห้ง (เครื่องทำความชื้น สายรัดคาง รักษาจมูก) ให้ความรู้ซ้ำ และเพิ่มการปรับพฤติกรรมหรือติดตามทางไกล")));
 const leak=pap.leak;
 if(leak==='high')o+=row('orange','<b>'+t(a("Leak","ลมรั่ว"))+':</b> '+t(a("high. Fix this first: mask size or type, headgear, mouth leak (full-face mask or chin strap).","สูง แก้ก่อน: ขนาด/ชนิดหน้ากาก สายรัดศีรษะ ลมรั่วทางปาก (หน้ากากคลุมปากและจมูก หรือสายรัดคาง)")));
 else if(leak==='ok')o+=row('emerald','<b>'+t(a("Leak","ลมรั่ว"))+':</b> '+t(a("acceptable.","ยอมรับได้")));
 else o+=row('slate','<b>'+t(a("Leak","ลมรั่ว"))+':</b> N/A');
 if(ra===null)o+=row('slate','<b>'+t(a("Residual AHI","AHI ที่เหลือ"))+':</b> N/A');
 else if(ra<5)o+=row('emerald','<b>'+t(a("Residual AHI","AHI ที่เหลือ"))+':</b> '+ra+' — '+t(a("at the usual target (< 5, the Thai guideline's \"optimal\" titration level).","ถึงเป้าปกติ (< 5 ซึ่งเป็นระดับ optimal ของการตั้งแรงดันตามแนวทางไทย)")));
 else o+=row(leak==='high'?'orange':'amber','<b>'+t(a("Residual AHI","AHI ที่เหลือ"))+':</b> '+ra+' — '+(leak==='high'?t(a("above 5 with high leak: correct the leak and re-read the download.","สูงกว่า 5 และลมรั่วสูง: แก้ลมรั่วแล้วดูข้อมูลเครื่องซ้ำ")):t(a("above 5 without a leak problem: review the pressure (re-titrate or adjust the APAP range), look for central events (treatment-emergent central apnoea) and consider BPAP or a sleep-specialist review.","สูงกว่า 5 โดยไม่มีปัญหาลมรั่ว: ทบทวนแรงดัน (titrate ซ้ำหรือปรับช่วง APAP) ดูเหตุการณ์ central (treatment-emergent central apnoea) และพิจารณา BPAP หรือส่งผู้เชี่ยวชาญด้านการนอนหลับ"))));
 const good=u!==null&&pc!==null&&u>=4&&pc>70&&ra!==null&&ra<5;
 if(pap.sl==='persists')o+=row(good?'violet':'orange','<b>'+t(a("Sleepiness","ความง่วง"))+':</b> '+(good?t(a("still sleepy despite good use and a controlled AHI. Look for another cause first (too little time in bed, other sleep disorders, sedating drugs, depression, anaemia, thyroid); consider MSLT; wake-promoting drugs only after other causes are excluded.","ยังง่วงทั้งที่ใช้ดีและ AHI คุมได้ ให้หาสาเหตุอื่นก่อน (เวลานอนไม่พอ โรคการนอนอื่น ยาที่ทำให้ง่วง ซึมเศร้า ซีด ไทรอยด์) พิจารณา MSLT และใช้ยากระตุ้นเมื่อตัดสาเหตุอื่นแล้วเท่านั้น")):t(a("still sleepy, but use or AHI is not yet at target: treat this as under-treatment and fix those first.","ยังง่วง แต่การใช้หรือ AHI ยังไม่ถึงเป้า ถือว่ารักษาไม่เพียงพอ ให้แก้สองข้อนั้นก่อน"))));
 else if(pap.sl==='none')o+=row('emerald','<b>'+t(a("Sleepiness","ความง่วง"))+':</b> '+t(a("no residual sleepiness.","ไม่มีความง่วงที่เหลือ")));
 return o;

function vCheck(){
 let tot=0,all=0;
 const bl=GROUPS.map(([k,c,ti,items])=>{
  const n=items.filter((_,i)=>checks[k+i]).length;tot+=n;all+=items.length;
  return det(k,c,t(ti),items.map(([l],i)=>`<label class="ck"><input type="checkbox" data-ck="${k+i}"${checks[k+i]?' checked':''}><span>${t(l)}</span></label>`).join(''),`${n}/${items.length}`);
 }).join('');
 const cnt=g=>GROUPS.find(x=>x[0]===g)[3].filter((_,i)=>checks[g+i]).length;
 const night=cnt('sx'),day=cnt('dx'),sg=cnt('sg'),cm=cnt('cm'),rf=cnt('rf');
 let msg=t(a('Tick what you find. This is a prompt for testing, not a diagnosis.','ติ๊กสิ่งที่พบ นี่เป็นตัวช่วยตัดสินใจส่งตรวจ ไม่ใช่การวินิจฉัย'));
 let c='slate';
 if(tot){
  if(rf){c='orange';msg=t(a('Red flag ticked: consider a sleep study soon; in-lab PSG is preferred.','ติ๊กสัญญาณเตือน: พิจารณาตรวจการนอนหลับโดยเร็ว แนะนำ PSG ในห้องปฏิบัติการ'))}
  else if((night>=2)&&(day>=1||sg>=2||cm>=1)){c='indigo';msg=t(a('Several typical features: consider STOP-Bang and a sleep study.','พบหลายข้อที่เข้าได้: พิจารณาทำ STOP-Bang และตรวจการนอนหลับ'))}
  else if(night+day+sg+cm>=3){c='indigo';msg=t(a('A few features: consider STOP-Bang and Epworth to decide on testing.','พบบางข้อ: พิจารณาทำ STOP-Bang และ Epworth เพื่อตัดสินใจส่งตรวจ'))}
  else{c='slate';msg=t(a('Few features ticked: this alone neither rules OSA in nor out.','ติ๊กน้อยข้อ: ข้อมูลนี้อย่างเดียวไม่ได้ยืนยันหรือตัด OSA'))}
 }
 const cx=det('compl','rose',t(a('Complications of OSA','ภาวะแทรกซ้อนของ OSA')),`<p class="note" style="margin:6px 0">${t(a('For awareness, not counted in the checklist. Compiled from general medical knowledge plus the sources named in each line; only those lines were checked against a source here.','เพื่อให้ตระหนัก ไม่นับรวมในเช็กลิสต์ รวบรวมจากความรู้ทางการแพทย์ทั่วไปและแหล่งที่ระบุในแต่ละข้อ เฉพาะข้อที่ระบุแหล่งเท่านั้นที่ตรวจเทียบกับแหล่งแล้ว'))}</p>`+lis(COMPL));
 return `<div class="res ${c}" style="display:flex;gap:10px;align-items:flex-start;justify-content:space-between"><div><b>${tot}/${all}</b> ${t(a('items ticked','ข้อที่ติ๊ก'))}<small>${msg}</small></div><div style="display:flex;flex-direction:column;gap:6px;flex:0 0 auto"><button class="btn" data-act="tostop" style="color:var(--ac);border-color:var(--ac)" title="${t(a('Copy matching ticks into STOP-Bang and Berlin','คัดลอกข้อที่ตรงไปยัง STOP-Bang และ Berlin'))}">${t(a('Use in scores →','ใช้ในคะแนน →'))}</button><button class="btn" data-act="clear">${t(UI.reset)}</button></div></div>`+bl+cx;
}

 const tog=`<label class="ck" style="align-items:flex-start"><input type="checkbox" class="sw" role="switch" aria-checked="${sbMod}" data-sbmod="1"${sbMod?' checked':''}><span style="flex:1;min-width:0"><b>${t(a('Modified STOP-Bang (Thai)','STOP-Bang แบบปรับปรุง (ไทย)'))}</b><small>${t(a('BMI cut-off > 30 instead of > 35; high risk = score ≥ 3. The Thai guideline words the BMI cut-off as "30 or 35" and cites Banhiran 2014 (303 Thai sleep-clinic patients; BMI > 30 was slightly more sensitive). Also tested in 400 surgical patients (Ramathibodi 2021).','BMI > 30 แทน > 35; ความเสี่ยงสูง = คะแนน ≥ 3 แนวทางไทยระบุเกณฑ์ BMI ว่า "30 หรือ 35" และอ้างอิง Banhiran 2014 (ผู้ป่วยคลินิกการนอนไทย 303 ราย; BMI > 30 ไวขึ้นเล็กน้อย) และทดสอบในผู้ป่วยผ่าตัด 400 ราย (รามาธิบดี 2021)'))}</small></span></label>`;
 const sb=tog+tog2+STOPQ.map(([q],i)=>`<label class="ck"><input type="checkbox" data-st="${i}"${stop[i]?' checked':''}><span>${t(qTxt(i,q))}</span></label>`).join('');

 +det('ess','amber','Epworth Sleepiness Scale',`<p class="note">${t(a('How likely are you to doze off (not just feel tired) in these situations, recently?','ในช่วงนี้ มีโอกาสเผลอหลับ (ไม่ใช่แค่รู้สึกเหนื่อย) ในสถานการณ์ต่อไปนี้มากเพียงใด'))}</p>${eb}`+lis([SCR[1]])+(e?`<div class="res ${e.c}"><b>${e.s}/24</b> — ${t(ESSTXT[e.k])}<small>${t(a('Above 10 suggests excessive daytime sleepiness; sleepiness may be absent in many OSA patients, so a low score does not exclude OSA.','เกิน 10 บ่งชี้ง่วงกลางวันผิดปกติ ผู้ป่วย OSA จำนวนมากไม่ง่วง คะแนนต่ำจึงไม่ตัด OSA'))}</small></div>`:`<div class="res slate">N/A <small>${t(a('Answer all 8 items.','ตอบให้ครบ 8 ข้อ'))}</small></div>`),e?e.s+'/24':'N/A')

function badgesFor(items){
 const th=items.some(x=>x.g===1),aa=items.some(x=>x.g===2),gen=items.some(x=>!x.g);
 let b=(th?'<span class="chip emerald">TH</span>':'')+(aa?'<span class="chip sky">AASM</span>':'')+(gen&&!th&&!aa?'<span class="chip slate">'+t(a('General','ทั่วไป'))+'</span>':'');
 const all=items.filter(x=>x.g===2).map(x=>x.en).join(' ');
 const s=['Strong','Standard','Conditional','Guideline','Weak'].find(w=>all.indexOf('('+w+')')>=0);
 return b+(items.some(x=>x.g===3)?'<span class="chip violet">ATS</span>':'')+(s?'<span class="chip '+PILL[s]+'">'+s+'</span>':'');
}

 const ac=el.dataset.act;
 if((ac==='close'||ac==='dclose'||ac==='sclose'||ac==='hclose')&&e.target!==el&&el.classList.contains('modal'))return;
 if(ac==='hand'){handOpen=true;handLang=lang;render();return}
 if(ac==='hclose'){handOpen=false;render();return}
 if(ac==='hlang'){handLang=el.dataset.v;render();return}
 if(ac==='hprint'){try{window.print()}catch(x){}return}
 if(ac==='hcopy'){copyHand(el);return}
 if(ac==='summary'){summaryOpen=true;render();return}
 if(ac==='sclose'){summaryOpen=false;render();return}
 if(ac==='scopy'){copySummary(el);return}
 if(ac==='sprint'){try{window.print()}catch(x){}return}
 if(ac==='donate'){donateOpen=true;render();return}
 if(ac==='dclose'){donateOpen=false;render();return}
 if(ac==='lang'){lang=lang==='en'?'th':'en';save()}
 else if(ac==='theme'){const d=document.documentElement.classList.toggle('dark');try{localStorage.setItem('osa-theme',d?'dark':'light')}catch(x){}}
 else if(ac==='log')modal=1;
 else if(ac==='close')modal=null;
 else if(ac==='tostop'){sendToScores();tab='score';openSet.add('stop');openSet.add('ber');render();window.scrollTo(0,0);return}
 else if(ac==='dismissfill'){fromCheck=null}
 else if(ac==='ptype'){psg.ttype=el.dataset.v==='home'?'home':'psg'}
 else if(ac==='newpt'){confirmNew=true}
 else if(ac==='newno'){confirmNew=false}
 else if(ac==='newyes'){resetAll()}
 else if(ac==='bodyfill'){fillStopFromBody()}
 else if(ac==='expandall'){GRP.flatMap(g=>g[1]).forEach(k=>openSet.add(k))}
 else if(ac==='collapseall'){GRP.flatMap(g=>g[1]).forEach(k=>openSet.delete(k));openSet.delete('map')}
 else if(ac==='clear'){checks={};save()}
 render();
});
document.addEventListener('change',e=>{
 const d=e.target.dataset;
 if(d.ck!==undefined){if(e.target.checked)checks[d.ck]=1;else delete checks[d.ck];save();render()}
 else if(d.ber!==undefined){ber[d.ber]=e.target.value===''?null:+e.target.value;render()}
 else if(d.pss!==undefined){psg[d.pss]=e.target.value;document.getElementById('psgout').innerHTML=psgOut();saveAll()}
 else if(d.bds!==undefined){body[d.bds]=e.target.value;document.getElementById('bodyout').innerHTML=bodyOut();saveAll()}
 else if(d.pps!==undefined){pap[d.pps]=e.target.value;document.getElementById('papout').innerHTML=papOut()}
 else if(d.sbmod!==undefined){sbMod=e.target.checked;if(sbMod)sbKku=false;render()}
 else if(d.sbkku!==undefined){sbKku=e.target.checked;if(sbKku)sbMod=false;render()}
 else if(d.st!==undefined){stop[d.st]=e.target.checked;render()}
 else if(d.ess!==undefined){ess[d.ess]=e.target.value===''?null:+e.target.value;render()}
});
document.addEventListener('input',e=>{
 const pk=e.target.dataset.pp;if(pk){pap[pk]=e.target.value;document.getElementById('papout').innerHTML=papOut();saveAll();return}
 const bk=e.target.dataset.bd;if(bk){body[bk]=e.target.value;document.getElementById('bodyout').innerHTML=bodyOut();saveAll();return}
 const k=e.target.dataset.ps;if(!k)return;
 psg[k]=e.target.value;document.getElementById('psgout').innerHTML=psgOut();saveAll();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(handOpen){handOpen=false;render()}else if(donateOpen){donateOpen=false;render()}else if(summaryOpen){summaryOpen=false;render()}else if(modal){modal=null;render()}}});
addEventListener('resize',()=>{const n=narrow();if(n!==lastN){lastN=n;render()}});
let lastN=narrow();
try{const l=document.createElement('link');l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700;800&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap';document.head.appendChild(l)}catch(e){}
loadAll();
render();
</script>
